function addGoal(){
  openSheet(t('newGoal'),_goalSheetHTML(null),()=>{
    const d=_readGoalSheet();if(!d.name)return;
    const maxId=(state.goals||[]).length?Math.max(...state.goals.map(g=>g.id)):0;
    if(!state.goals)state.goals=[];
    state.goals.push({id:maxId+1,...d,_celebrated:false});
    saveState();closeSheet();renderDashboard();if(activeTab==='budget')renderBudget();
  });
}

function editGoal(id){
  const g=state.goals.find(x=>x.id===id);if(!g)return;
  openSheet(t('editGoalTitle'),_goalSheetHTML(g),()=>{
    const d=_readGoalSheet();if(!d.name)return;
    const wasAchieved=g.currentAmount>=g.targetAmount&&g.targetAmount>0;
    Object.assign(g,d);
    // Reset celebration flag if no longer achieved
    if(g.currentAmount<g.targetAmount)g._celebrated=false;
    // If newly achieved, celebrate
    if(!wasAchieved&&g.currentAmount>=g.targetAmount&&g.targetAmount>0){g._celebrated=false;}
    saveState();closeSheet();renderDashboard();if(activeTab==='budget')renderBudget();
  });
}

function _deleteGoal(id){
  state.goals=state.goals.filter(g=>g.id!==id);
  saveState();closeSheet();renderDashboard();if(activeTab==='budget')renderBudget();
}

/* CONFETTI */
function triggerConfetti(){
  const container=document.createElement('div');
  container.className='confetti-container';
  document.body.appendChild(container);
  const colors=['#7c6aff','#3ecf8e','#ffd166','#ff6b6b','#ff9f43','#ffffff'];
  const shapes=['border-radius:50%','border-radius:2px','border-radius:0'];
  for(let i=0;i<80;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=Math.random()*10+6;
    const x=Math.random()*100;
    const dur=Math.random()*2+2;
    const delay=Math.random()*1.2;
    const col=colors[Math.floor(Math.random()*colors.length)];
    const sh=shapes[Math.floor(Math.random()*shapes.length)];
    p.style.cssText=`left:${x}%;width:${size}px;height:${size}px;background:${col};${sh};animation-duration:${dur}s;animation-delay:${delay}s;opacity:1;`;
    container.appendChild(p);
  }
  setTimeout(()=>container.remove(),5000);
}

let _toastTimer = null;
function showToast(msg, duration=5000){
  const toast=document.getElementById('backup-toast');
  const txt=document.getElementById('toast-text');
  if(!toast||!txt)return;
  txt.textContent=msg;
  toast.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>dismissToast(),duration);
}
function dismissToast(){
  const toast=document.getElementById('backup-toast');
  if(toast)toast.classList.remove('show');
  clearTimeout(_toastTimer);
}

function exportCSV(){
  const isHu=getLang()==='hu';
  const sym=getCurrSym();
  const rows=[['Year','Month','Income','CoreExpenses','ChoiceExpenses','Invested','Emergency','Bank','CashLocal','CashForeign','Portfolio','NetWorth','Remain']];
  const sc=state.secondaryCurrency;
  const secRate=sc?sc.rate:0;
  const years=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
  years.forEach(yr=>{
    const yd=state.years[String(yr)];
    (yd.months||[]).forEach(m=>{
      const inc=mInc(m),core=mCore(m),choice=mChoice(m),inv=m.invested||0,emg=m.emergency||0;
      const a=m.assets||{bank:0,cashHUF:0,cashEUR:0,portfolio:0};
      const nw=a.bank+a.cashHUF+a.cashEUR*secRate+a.portfolio;
      const rem=inc-core-choice-inv;
      rows.push([yr,t('months')[m.month-1],inc,core,choice,inv,emg,a.bank,a.cashHUF,a.cashEUR,a.portfolio,Math.round(nw),rem]);
    });
  });
  const csv=rows.map(r=>r.map(v=>{
    const s=String(v);
    return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(',')).join('\r\n');
  const dateStr=new Date().toISOString().slice(0,10);
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  _downloadBlob(blob,`financial-plan-${dateStr}.csv`);
  showToast(isHu?'✅ CSV exportálva!':'✅ CSV exported!',3000);
}

function importJSON(){

  el.onchange=function(){
    const file=el.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const parsed=JSON.parse(e.target.result);
        if(!parsed||typeof parsed!=='object'||!parsed.years) throw new Error('Invalid structure');
        const isHu=getLang()==='hu';
        const msg=isHu
          ?'Ez az aktuális összes adatodat felváltja. Folytatod?'

        if(activeTab==='ai')renderAI();

function copyShareLink(){
  const isHu=getLang()==='hu';
  try{
    if(typeof LZString==='undefined') throw new Error('LZString not loaded');
    // Exclude sensitive key from share
    const shareState={...state,geminiKey:''};
    const compressed=LZString.compressToEncodedURIComponent(JSON.stringify(shareState));
    const url=window.location.href.split('#')[0]+'#data='+compressed;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>{
        showToast(isHu?'🔗 Hivatkozás másolva a vágólapra!':'🔗 Share link copied to clipboard!',4000);
      }).catch(()=>_fallbackCopy(url,isHu));
    }else{
      _fallbackCopy(url,isHu);
    }
  }catch(err){
    showToast(isHu?'❌ Nem sikerült a másolás.':'❌ Copy failed: '+err.message,4000);
  }
}

function _fallbackCopy(text,isHu){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.cssText='position:fixed;top:-999px;left:-999px;';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast(isHu?'🔗 Hivatkozás másolva!':'🔗 Share link copied!',4000);}
  catch(e){prompt(isHu?'Másold ki a hivatkozást:':'Copy this link:',text);}
  document.body.removeChild(ta);
}

function _downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},1000);
}

function _checkShareHash(){
  const hash=window.location.hash;
  if(!hash.startsWith('#data='))return;
  const compressed=hash.slice(6);
  if(!compressed)return;
  try{
    if(typeof LZString==='undefined')return;
    const json=LZString.decompressFromEncodedURIComponent(compressed);
    if(!json)return;
    const parsed=JSON.parse(json);
    if(!parsed||!parsed.years)return;
    const isHu=(parsed.settings?.language||'hu')==='hu';
    const msg=isHu
      ?'📤 Megosztott terv importálása? Ez az aktuális adataidat felváltja.'
      :'📤 Import shared plan? This will replace your current data.';
    setTimeout(()=>{
      if(confirm(msg)){
        state=parsed;
        migrateState();
        saveState();
        updateStaticUI();updateHeader();
        renderDashboard();renderBudget();renderInvest();
        window.location.hash='';
        showToast(isHu?'✅ Megosztott terv importálva!':'✅ Shared plan imported!',4000);
      }else{
        window.location.hash='';
      }
    },800);
  }catch(e){
    window.location.hash='';
  }
}

============================================================ */
async function fetchLiveSecRate(secCode, primaryCode){
  try{
    if(!secCode||!primaryCode)throw new Error('Missing codes');
    const base=secCode.toLowerCase(),target=primaryCode.toLowerCase();
    const res=await fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${base}.json`);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const rate=data[base]&&data[base][target];
    if(!rate||isNaN(rate))throw new Error('Bad data');
    return rate;
  }catch(err){
    console.warn('Live rate fetch failed:',err);
    return null;
  }
}

async function refreshSecRate(){
  const sc=state.secondaryCurrency;
  if(!sc)return;
  const primaryCode=state.settings.currencyCode||'';
  if(!primaryCode){alert(getLang()==='hu'?'Állítsd be az elsődleges deviza ISO kódját a Beállításokban!':'Set your primary currency ISO code in Settings first!');return;}
  const btn=document.getElementById('eur-refresh-icon');
  if(btn)btn.classList.add('spinning');
  const rate=await fetchLiveSecRate(sc.code,primaryCode);
  if(btn)btn.classList.remove('spinning');
  if(rate){
    sc.rate=rate;sc.rateLastFetched=Date.now();sc.rateLive=true;
  }else{
    sc.rateLive=false;
  }
  saveState();
  renderDashboard();
  if(activeTab==='invest')renderInvest();
}

function updateWizardStep() {
  // Update skip/back/next labels (language may have changed on step 1)
  const skipBtn = document.querySelector('.wiz-skip-btn');
  if (skipBtn) skipBtn.textContent = t('wizSkip');
  const backBtn = document.getElementById('wiz-back');
  if (backBtn) { backBtn.textContent = t('wizBack'); backBtn.style.display = wizStep === 1 ? 'none' : ''; }
  const nextBtn = document.getElementById('wiz-next');
  if (nextBtn) { nextBtn.textContent = t('wizNext'); nextBtn.style.display = wizStep === 5 ? 'none' : ''; }

  // Progress dots
  const prog = document.getElementById('wizard-progress');
  if (prog) prog.innerHTML = [1,2,3,4,5].map(i =>
    `<div class="wiz-dot ${i < wizStep ? 'done' : i === wizStep ? 'active' : ''}"></div>`
  ).join('');

  // Render body
  const body = document.getElementById('wizard-body');
  if (!body) return;
  if (wizStep === 1) body.innerHTML = renderWizStep1();
  else if (wizStep === 2) body.innerHTML = renderWizStep2();
  else if (wizStep === 3) body.innerHTML = renderWizStep3();
  else if (wizStep === 4) body.innerHTML = renderWizStep4();
  else if (wizStep === 5) body.innerHTML = renderWizStep5();
  body.scrollTop = 0;

  // Post-render event binding
  if (wizStep === 1) {
    document.querySelectorAll('.lang-opt').forEach(el => {
      el.addEventListener('click', () => {
        state.settings.language = el.dataset.lang;
        saveState(); updateStaticUI(); updateWizardStep();
      });
    });
    document.querySelectorAll('.curr-chip').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.dataset.curr;
        if (val === 'custom') {
          const c = prompt(t('wizCurrLabel') + ':') || state.settings.currencySymbol;
          state.settings.currencySymbol = c.trim() || state.settings.currencySymbol;
        } else {
          state.settings.currencySymbol = val;
        }
        saveState(); updateWizardStep();
      });
    });
  }
  if (wizStep === 4) {
    document.querySelectorAll('.inv-choice-card').forEach(el => {
      el.addEventListener('click', () => {
        wizSaveCurrentStep();
        _wizData.investMode = el.dataset.mode;
        updateWizardStep();
      });
    });
  }
}

function wizSaveCurrentStep() {
  if (wizStep === 2) {
    const rows = document.querySelectorAll('.wiz-inc-row');
    const saved = [];
    rows.forEach((row, i) => {
      const name = row.querySelector('.wiz-inc-name')?.value?.trim() || '';
      const amount = parseFloat(row.querySelector('.wiz-inc-amt')?.value) || 0;
      saved.push({id:i+1, name, amount});
    });
    if (saved.length) _wizData.incomes = saved;
  }
  if (wizStep === 3) {
    const slots = document.querySelectorAll('.wiz-exp-slot');
    const expNames = ['Housing','Food','Lifestyle'];
    const expCats = ['Core','Core','Choice'];
    slots.forEach((slot, i) => {
      const amount = parseFloat(slot.querySelector('.wiz-exp-amt')?.value) || 0;
      _wizData.expenses[i] = {id:i+1, name:expNames[i], amount, category:expCats[i]};
    });
    // Extra expense rows
    const extras = _wizData.expenses.slice(3); // preserve already saved extras
    const newExtras = [];
    document.querySelectorAll('.wiz-extra-exp').forEach((row, i) => {
      const name = row.querySelector('.wiz-extra-name')?.value?.trim() || '';
      const amount = parseFloat(row.querySelector('.wiz-extra-amt')?.value) || 0;
      const cat = row.querySelector('.wiz-extra-cat')?.value || 'Core';
      if (name) newExtras.push({id:10+i, name, amount, category:cat});
    });
    _wizData.expenses = _wizData.expenses.slice(0,3).concat(newExtras);
  }
  if (wizStep === 4) {
    if (_wizData.investMode === 'existing') {
      _wizData.investName  = document.getElementById('wiz-iname')?.value?.trim() || 'VWCE ETF';
      _wizData.investTicker= document.getElementById('wiz-ticker')?.value?.trim() || '';
      _wizData.investReturn= parseFloat(document.getElementById('wiz-ret')?.value) || 7;
      _wizData.investMonthly= parseFloat(document.getElementById('wiz-monthly')?.value) || 0;
      _wizData.investAccount= document.getElementById('wiz-account')?.value?.trim() || '';
    } else if (_wizData.investMode === 'start') {
      _wizData.savingsMonthly = parseFloat(document.getElementById('wiz-savings')?.value) || 0;
    }
  }
}

function wizNext() {
  wizSaveCurrentStep();
  if (wizStep < 5) { wizStep++; updateWizardStep(); }
}

function wizBack() {
  wizSaveCurrentStep();
  if (wizStep > 1) { wizStep--; updateWizardStep(); }
}

function completeOnboarding() {
  wizSaveCurrentStep();
  const lang = getLang();
  const expLabelMap = {
    Housing:  lang==='hu' ? 'Lakhatás / Albérlet' : 'Housing / Rent',
    Food:     lang==='hu' ? 'Élelmiszer / Kaja'     : 'Food',
    Lifestyle:lang==='hu' ? 'Életstílus / Szórakozás':'Lifestyle / Fun',
  };
  const incomes = _wizData.incomes
    .filter(i => i.amount > 0 || i.name)
    .map((i, idx) => ({id:idx+1, name:i.name||(lang==='hu'?'Bevétel':'Income'), amount:i.amount}));
  const expenses = _wizData.expenses
    .filter(e => e.amount > 0 || (e.id >= 10 && e.name))
    .map((e, idx) => ({id:idx+1, name:expLabelMap[e.name]||e.name, amount:e.amount, category:e.category}));
  const invMonthly = _wizData.investMode==='existing' ? (_wizData.investMonthly||0)
                   : _wizData.investMode==='start'    ? (_wizData.savingsMonthly||0) : 0;

  // Apply to all months in current year
  const yd = getYD();
  yd.months.forEach(m => {
    if (incomes.length)  m.income   = incomes.map(x=>({...x}));
    if (expenses.length) m.expenses = expenses.map(x=>({...x}));
    if (invMonthly > 0) { m.invested = invMonthly; m.vwce = invMonthly; }
    if (_wizData.investMode==='start' && invMonthly > 0)
      m.note = lang==='hu' ? 'Tervezett megtakarítás' : 'Planned savings';
  });

  // Investment config
  if (_wizData.investMode === 'existing') {
    state.investmentConfig = {
      name: _wizData.investName || 'VWCE ETF',
      ticker: _wizData.investTicker || '',
      expectedReturn: _wizData.investReturn || 7,
      note: _wizData.investAccount || 'DCA'
    };
    state.calculator.rate = _wizData.investReturn || 7;
  }

  state.onboardingComplete = true;
  saveState();
  closeOnboarding();
  updateStaticUI(); updateHeader();
  renderDashboard(); renderBudget(); renderInvest();
  if (!['summary','budget','invest'].includes(activeTab)) renderTab(activeTab);
}

function renderWizStep5() {
  // Gather wizard data for preview
  const totalInc = _wizData.incomes.reduce((s,i) => s+(parseFloat(i.amount)||0), 0);
  const totalCore = _wizData.expenses.filter(e=>e.category==='Core').reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
  const totalChoice = _wizData.expenses.filter(e=>e.category==='Choice').reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
  const totalInv = _wizData.investMode==='existing' ? (_wizData.investMonthly||0)
                 : _wizData.investMode==='start'    ? (_wizData.savingsMonthly||0) : 0;
  const totalFree = totalInc - totalCore - totalChoice - totalInv;
  const pct = v => totalInc > 0 ? Math.min(100, v/totalInc*100) : 0;
  const corePct=pct(totalCore), choicePct=pct(totalChoice), compPct=pct(totalInv);
  const freePct=Math.max(0, pct(totalFree));
  const score = mmScore(compPct);

  const mmRow = (badgeCls, badge, label, amount, p, fillColor) => `
    <div class="mm-preview-row">
      <div class="mm-preview-label">
        <span style="display:flex;align-items:center;gap:6px"><span class="cat-badge ${badgeCls}" style="font-size:8px;padding:1px 5px">${badge}</span>${label}</span>
        <span>${fmt(amount)} · ${fmtP(p)}</span>
      </div>
      <div class="mm-preview-bar"><div style="width:${p}%;height:100%;border-radius:3px;background:${fillColor}"></div></div>
    </div>`;

  return `
    <div class="wiz-headline">${t('wizStep5Title')}</div>
    <div class="wiz-sub">${t('wizStep5Sub')}</div>
    <div class="mm-preview-card">
      <div style="font-size:12px;color:var(--muted2);margin-bottom:12px">${t('income')}: <span style="color:var(--accent2);font-family:var(--font-mono)">${fmt(totalInc)}</span></div>
      ${mmRow('core','Core',t('necessary'),totalCore,corePct,'var(--accent2)')}
      ${mmRow('choice','Choice',t('discretionary'),totalChoice,choicePct,'var(--accent)')}
      ${mmRow('compound','Compound',t('investment'),totalInv,compPct,'var(--accent4)')}
      <div class="mm-preview-row" style="margin-bottom:0">
        <div class="mm-preview-label">
          <span style="color:var(--muted)">${t('freeRemainder')}</span>
          <span style="color:${totalFree>=0?'var(--text)':'var(--accent3)'}">${totalFree>=0?'+':''}${fmt(totalFree)}</span>
        </div>
        <div class="mm-preview-bar"><div style="width:${freePct}%;height:100%;border-radius:3px;background:rgba(255,255,255,0.18)"></div></div>
      </div>
    </div>
    <div class="score-big-card" style="margin-bottom:4px">
      <div class="score-big-num ${score.cls}">${score.score}</div>
      <div class="score-big-info">
        <div class="score-big-label">${score.emoji} ${score.label}</div>
        <div class="score-big-sub">${t('moneyMapScore')}</div>
        <div class="score-big-pct" style="color:${scoreColor(score.cls)}">${fmtP(compPct)}</div>
      </div>
    </div>
    <button class="wiz-start-btn" onclick="completeOnboarding()">${t('wizStartBtn')}</button>
    <div style="height:32px"></div>`;
}

function showWizTooltip(event, key) {
  event.stopPropagation();
  const text = t(key);
  // Remove any existing tooltip
  document.querySelectorAll('.wiz-tooltip-pop').forEach(el => el.remove());
  const pop = document.createElement('div');
  pop.className = 'wiz-tooltip-pop';
  pop.textContent = text;
  document.body.appendChild(pop);
  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  const popW = 260;
  let left = rect.left + btn.offsetWidth/2 - popW/2;
  if (left < 8) left = 8;
  if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
  pop.style.cssText = `left:${left}px;top:${rect.bottom+8}px;`;
  let timer = setTimeout(() => pop.remove(), 4500);
  document.addEventListener('click', () => { clearTimeout(timer); pop.remove(); }, {once:true, capture:true});
}

// Check for shared plan in URL hash
_checkShareHash();
// Auto-fetch live rate on startup if secondary currency and primary code are both configured
(async()=>{
  const sc=state.secondaryCurrency;
  const primaryCode=state.settings.currencyCode||'';
  if(!sc||!primaryCode)return;
  const rate=await fetchLiveSecRate(sc.code,primaryCode);
  if(rate){sc.rate=rate;sc.rateLastFetched=Date.now();sc.rateLive=true;}
  else{sc.rateLive=false;}
  saveState();
  renderDashboard();
  if(activeTab==='invest')renderInvest();
})();
