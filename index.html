<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a26;--card:#16161f;--border:rgba(255,255,255,0.07);
  --accent:#7c6aff;--accent2:#3ecf8e;--accent3:#ff6b6b;--accent4:#ffd166;--accent5:#ff9f43;
  --text:#f0f0f8;--muted:#6b6b80;--muted2:#9494a8;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
}

/* ── DARK THEME (explicit) ── */
html.dark{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a26;--card:#16161f;--border:rgba(255,255,255,0.07);
  --text:#f0f0f8;--muted:#6b6b80;--muted2:#9494a8;
}

/* ── LIGHT THEME ── */
html.light{
  --bg:#f4f4f8;--bg2:#eeeef4;--bg3:#e6e6f0;--card:#ffffff;--border:rgba(0,0,0,0.09);
  --text:#1a1a2e;--muted:#888899;--muted2:#666677;
}
html.light body::before{background-image:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(124,106,255,0.07) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 10% 80%,rgba(62,207,142,0.05) 0%,transparent 50%);}
html.light #app-header{background:rgba(244,244,248,0.97);}
html.light #bottom-nav{background:rgba(244,244,248,0.97);}
html.light #bottom-sheet,html.light .sheet-btns{background:#f0f0f8;}
html.light #settings-sheet,html.light #settings-sheet>div{background:#f0f0f8!important;}
html.light #onboarding-card,html.light #wizard-footer{background:#f0f0f8!important;}
html.light #onboarding-overlay{background:rgba(244,244,248,0.98);}
html.light #sheet-overlay{background:rgba(120,120,150,0.55);}
html.light #settings-overlay{background:rgba(120,120,150,0.55)!important;}
html.light .sheet-input{background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.13);}
html.light .sheet-hint{background:rgba(124,106,255,0.07);}
html.light .sheet-cancel{background:rgba(0,0,0,0.06);border-color:rgba(0,0,0,0.1);}
html.light .budget-sec-footer{background:rgba(0,0,0,0.03);}
html.light .budget-item-v2:active{background:rgba(0,0,0,0.04);}
html.light .mm-bar-track{background:rgba(0,0,0,0.08);}
html.light .mm-bar-fill.remain-fill{background:rgba(0,0,0,0.14);}
html.light .score-mini-card{background:rgba(0,0,0,0.05);}
html.light .stat-card,.html.light .milestone-card{background:rgba(0,0,0,0.05);}
html.light .forecast-bar-item{background:rgba(0,0,0,0.04);}
html.light .stat-card{background:rgba(0,0,0,0.05);}
html.light .milestone-card{background:rgba(0,0,0,0.05);}
html.light input[type=range]{background:rgba(0,0,0,0.12);}
html.light .month-pill{background:rgba(0,0,0,0.04);}
html.light .month-item{background:#fff;}
html.light .goal-progress-track{background:rgba(0,0,0,0.08);}
html.light .highlight-box{background:rgba(124,106,255,0.06);border-color:rgba(124,106,255,0.18);}
html.light .warn-box{background:rgba(255,209,102,0.07);}
html.light .forecast-card{background:linear-gradient(135deg,rgba(124,106,255,0.07) 0%,rgba(62,207,142,0.05) 100%);}
html.light .result-box.green{background:rgba(62,207,142,0.07);}
html.light .result-box.red{background:rgba(255,107,107,0.07);}
html.light .insight-card.success{background:rgba(62,207,142,0.05);}
html.light .insight-card.warning{background:rgba(255,209,102,0.05);}
html.light .insight-card.danger{background:rgba(255,107,107,0.05);}
html.light .insight-card.info{background:rgba(124,106,255,0.05);}
html.light .wiz-dot{background:rgba(0,0,0,0.12);}
html.light .lang-opt{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1);}
html.light .inv-choice-card{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1);}
html.light .emoji-opt{background:rgba(0,0,0,0.04);}
html.light .wiz-tooltip-pop{background:#f0f0f8;box-shadow:0 8px 32px rgba(0,0,0,0.14);}
html.light .tag-chip.other{background:rgba(0,0,0,0.04);}
html.light .an-card{background:#fff;}
html.light .calc-card{background:#fff;}
html.light .invest-cfg-card{background:#fff;}
html.light .score-big-card{background:#fff;}
html.light .export-btn{background:rgba(0,0,0,0.03)!important;}
html.light .mm-preview-card{background:rgba(0,0,0,0.03);}
html.light .mm-preview-bar{background:rgba(0,0,0,0.08);}

/* ── SETTINGS TOGGLE ROWS ── */
.settings-toggle-group{display:flex;gap:6px;margin-bottom:16px;}
.stg-btn{flex:1;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:10px;color:var(--muted2);font-size:12px;cursor:pointer;padding:10px 4px;font-family:var(--font-body);transition:all 0.2s;line-height:1.3;text-align:center;min-height:44px;display:flex;align-items:center;justify-content:center;}
.stg-btn:active{opacity:0.75;}
.stg-btn.active{background:rgba(124,106,255,0.15);border-color:var(--accent);color:var(--accent);}
html.light .stg-btn{background:rgba(0,0,0,0.04);}
html.light .stg-btn.active{background:rgba(124,106,255,0.12);}

/* ── REDUCE MOTION ── */
@media(prefers-reduced-motion:reduce){
  *{transition-duration:0.01ms!important;animation-duration:0.01ms!important;}
  .fade-in{animation:none!important;}
}

/* ── TAP TARGET FIXES ── */
.delete-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:8px;line-height:1;flex-shrink:0;transition:color 0.15s;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
.delete-btn:active{color:var(--accent3);}
.month-nav-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background 0.15s;}
.month-pill{flex-shrink:0;padding:0 14px;border-radius:20px;font-size:12px;font-family:var(--font-mono);cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted2);transition:all 0.15s;white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;height:100dvh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(124,106,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 10% 80%,rgba(62,207,142,0.07) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* HEADER */
#app-header{position:relative;z-index:10;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.app-title{font-family:var(--font-head);font-size:17px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;}
.month-nav{display:flex;align-items:center;gap:4px;}
/* TAP TARGETS DEFINED IN THEME BLOCK ABOVE */
/* month-nav-btn, month-pill, delete-btn already defined with 44px min targets */
.month-nav-btn:active{background:rgba(255,255,255,0.14);}
.month-nav-display{font-family:var(--font-mono);font-size:13px;color:var(--accent);min-width:92px;text-align:center;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background 0.15s;}
.month-nav-display:active{background:rgba(124,106,255,0.1);}

/* TAB SYSTEM */
#tab-content{flex:1;overflow:hidden;position:relative;z-index:1;}
.tab-pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;display:none;max-width:500px;margin:0 auto;width:100%;}
.tab-pane.active{display:block;}
.tab-pane::-webkit-scrollbar{width:3px;}
.tab-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

/* BOTTOM NAV */
#bottom-nav{position:relative;z-index:10;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;min-height:54px;gap:2px;border:none;background:none;color:var(--muted);transition:color 0.2s;}
.nav-item.active{color:var(--accent);}
.nav-item:active{opacity:0.7;}
.nav-icon{font-size:18px;line-height:1;}
.nav-label{font-size:9px;font-family:var(--font-mono);letter-spacing:0.02em;white-space:nowrap;}

/* SECTION LABEL */
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;margin-top:20px;display:flex;align-items:center;gap:12px;}
.section-label:first-child{margin-top:0;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.card.tap{cursor:pointer;transition:border-color 0.2s;}
.card.tap:active{border-color:rgba(255,255,255,0.18);}
.card-label{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px;letter-spacing:0.05em;}
.card-value{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:5px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.full{grid-column:1/-1;}

/* COLORS */
.green{color:var(--accent2);}.purple{color:var(--accent);}.red{color:var(--accent3);}.yellow{color:var(--accent4);}.orange{color:var(--accent5);}

/* RESULT BOX */
.result-box{border-radius:14px;padding:16px 18px;border:1px solid;}
.result-box.green{background:rgba(62,207,142,0.08);border-color:rgba(62,207,142,0.2);}
.result-box.red{background:rgba(255,107,107,0.08);border-color:rgba(255,107,107,0.2);}
.result-box .rb-label{font-size:11px;font-family:var(--font-mono);color:var(--muted2);margin-bottom:4px;}
.result-box .rb-value{font-family:var(--font-head);font-size:26px;font-weight:800;letter-spacing:-0.02em;}
.result-box.green .rb-value{color:var(--accent2);}
.result-box.red .rb-value{color:var(--accent3);}
.result-box .rb-sub{font-size:12px;color:var(--muted2);margin-top:4px;}

/* CAT BADGES */
.cat-badge{display:inline-block;font-size:9px;font-family:var(--font-mono);padding:2px 7px;border-radius:6px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;flex-shrink:0;}
.cat-badge.core{background:rgba(62,207,142,0.12);color:var(--accent2);border:1px solid rgba(62,207,142,0.2);}
.cat-badge.choice{background:rgba(124,106,255,0.12);color:var(--accent);border:1px solid rgba(124,106,255,0.2);}
.cat-badge.compound{background:rgba(255,209,102,0.12);color:var(--accent4);border:1px solid rgba(255,209,102,0.2);}

/* MONEY MAP BARS */
.mm-bar-row{margin-bottom:12px;}
.mm-bar-row:last-child{margin-bottom:0;}
.mm-bar-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mm-bar-name{font-size:12px;color:var(--muted2);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
.mm-bar-nums{display:flex;align-items:center;gap:8px;}
.mm-bar-amount{font-size:12px;color:var(--text);font-family:var(--font-mono);}
.mm-bar-pct{font-size:11px;color:var(--muted);font-family:var(--font-mono);min-width:38px;text-align:right;}
.mm-bar-track{height:8px;border-radius:4px;background:rgba(255,255,255,0.07);overflow:hidden;}
.mm-bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.mm-bar-fill.core-fill{background:var(--accent2);}
.mm-bar-fill.choice-fill{background:var(--accent);}
.mm-bar-fill.compound-fill{background:var(--accent4);}
.mm-bar-fill.remain-fill{background:rgba(255,255,255,0.18);}

/* SCORE */
.score-big-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:10px;}
.score-big-num{font-family:var(--font-head);font-size:58px;font-weight:800;line-height:1;letter-spacing:-0.03em;flex-shrink:0;}
.score-big-info{flex:1;min-width:0;}
.score-big-label{font-family:var(--font-head);font-size:17px;font-weight:700;margin-bottom:2px;}
.score-big-sub{font-size:11px;color:var(--muted2);line-height:1.5;}
.score-big-pct{font-family:var(--font-mono);font-size:20px;font-weight:600;margin-top:6px;}
.score-compare{display:flex;gap:8px;margin-top:10px;}
.score-mini-card{flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 8px;text-align:center;}
.score-mini-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:5px;letter-spacing:0.05em;}
.score-mini-num{font-family:var(--font-head);font-size:28px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
.score-mini-sub{font-size:10px;color:var(--muted2);margin-top:3px;font-family:var(--font-mono);}
.score-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-family:var(--font-mono);}
.score-badge.green{background:rgba(62,207,142,0.15);color:var(--accent2);}
.score-badge.yellow{background:rgba(255,209,102,0.15);color:var(--accent4);}
.score-badge.orange{background:rgba(255,159,67,0.15);color:var(--accent5);}
.score-badge.red{background:rgba(255,107,107,0.15);color:var(--accent3);}

/* MONTH PILLS */
.month-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px;}
.month-pills::-webkit-scrollbar{display:none;}
/* month-pill active/has-inv states */
.month-pill.active{background:rgba(124,106,255,0.15);border-color:rgba(124,106,255,0.4);color:var(--accent);}
.month-pill.has-inv{border-color:rgba(62,207,142,0.3);color:var(--accent2);}
.month-pill.active.has-inv{background:rgba(62,207,142,0.1);border-color:rgba(62,207,142,0.5);}

/* BUDGET SECTIONS */
.budget-sec{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.budget-item-v2{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s;}
.budget-item-v2:last-child{border-bottom:none;}
.budget-item-v2:active{background:rgba(255,255,255,0.04);}
.budget-item-v2 .item-name{flex:1;font-size:14px;min-width:0;}
.budget-item-v2 .item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.budget-item-v2 .item-amount{font-family:var(--font-mono);font-size:13px;font-weight:500;white-space:nowrap;}
.item-amount.income{color:var(--accent2);}.item-amount.expense{color:var(--accent3);}
.budget-sec-footer{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:rgba(0,0,0,0.15);}
.footer-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:0.05em;}
.footer-pct{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.footer-total{font-family:var(--font-mono);font-size:14px;font-weight:500;}

/* INVESTMENT LIST */
.month-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:3px solid transparent;transition:border-color 0.15s;margin-bottom:8px;}
.month-item:active{border-color:rgba(255,255,255,0.18);}
.month-item.has-inv{border-left-color:rgba(62,207,142,0.5);}
.month-item.is-current{border-left-color:rgba(124,106,255,0.6);}
.month-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;}
.month-dot.filled{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 8px rgba(62,207,142,0.4);}
.month-dot.current{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(124,106,255,0.6);}
.month-info{flex:1;min-width:0;}
.month-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
.month-note{font-size:11px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.month-alloc{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:2px;}
.current-badge{background:rgba(124,106,255,0.2);color:var(--accent);font-size:10px;font-family:var(--font-mono);padding:2px 7px;border-radius:10px;}
.month-amount{font-family:var(--font-mono);font-size:13px;white-space:nowrap;color:var(--muted);}
.month-amount.active{color:var(--accent2);}

/* CALCULATOR */
.calc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
.slider-group{margin-bottom:18px;}
.slider-group:last-child{margin-bottom:0;}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.slider-label{font-size:13px;color:var(--muted2);}
.slider-val{font-family:var(--font-mono);font-size:15px;font-weight:500;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,0.1);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(124,106,255,0.25),0 2px 8px rgba(0,0,0,0.4);cursor:pointer;}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(124,106,255,0.3),0 2px 8px rgba(0,0,0,0.4);}
.stat-card{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 8px;text-align:center;}
.stat-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:6px;letter-spacing:0.05em;}
.stat-value{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.milestone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.milestone-card{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;}
.milestone-label{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px;}
.milestone-value{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.02em;}
.milestone-sub{font-size:11px;color:var(--muted2);}
.chart-wrap{position:relative;width:100%;height:220px;margin-top:16px;}
.sync-btn{width:100%;background:rgba(124,106,255,0.1);border:1px solid rgba(124,106,255,0.25);color:var(--accent);border-radius:12px;padding:12px;font-size:13px;font-family:var(--font-body);cursor:pointer;transition:background 0.15s;margin-top:12px;}
.sync-btn:active{background:rgba(124,106,255,0.22);}

/* INVEST CONFIG CARD */
.invest-cfg-card{background:var(--card);border:1px solid rgba(124,106,255,0.3);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:14px;gap:12px;transition:border-color 0.2s;}
.invest-cfg-card:active{border-color:rgba(124,106,255,0.6);}
.invest-cfg-left{flex:1;min-width:0;}
.invest-cfg-name{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.invest-cfg-ticker{font-family:var(--font-mono);font-size:11px;background:rgba(124,106,255,0.15);color:var(--accent);padding:2px 7px;border-radius:8px;}
.invest-cfg-detail{font-size:11px;color:var(--muted2);margin-top:3px;font-family:var(--font-mono);}
.invest-cfg-icon{font-size:18px;color:var(--muted);flex-shrink:0;}

/* ANALYTICS */
.an-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.an-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.an-sub{font-size:11px;color:var(--muted2);margin-bottom:14px;}
.chart-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block;}

/* AI TAB */
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
.insight-emoji{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px;}
.insight-body{flex:1;min-width:0;}
.insight-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.insight-text{font-size:13px;color:var(--muted2);line-height:1.5;}
.insight-card.success{border-color:rgba(62,207,142,0.25);background:rgba(62,207,142,0.04);}
.insight-card.warning{border-color:rgba(255,209,102,0.25);background:rgba(255,209,102,0.04);}
.insight-card.danger{border-color:rgba(255,107,107,0.25);background:rgba(255,107,107,0.04);}
.insight-card.info{border-color:rgba(124,106,255,0.25);background:rgba(124,106,255,0.04);}

/* FORECAST */
.forecast-card{background:linear-gradient(135deg,rgba(124,106,255,0.1) 0%,rgba(62,207,142,0.06) 100%);border:1px solid rgba(124,106,255,0.3);border-radius:14px;padding:20px;margin-bottom:10px;}
.forecast-title{font-size:11px;font-family:var(--font-mono);color:var(--muted2);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
.forecast-amount{font-family:var(--font-head);font-size:36px;font-weight:800;letter-spacing:-0.03em;color:var(--accent);margin-bottom:6px;}
.forecast-detail{font-size:12px;color:var(--muted2);line-height:1.6;}
.forecast-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.forecast-bar-item{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 8px;text-align:center;}
.forecast-bar-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:4px;letter-spacing:0.05em;text-transform:uppercase;}
.forecast-bar-value{font-family:var(--font-head);font-size:16px;font-weight:700;}

/* CHAT */
.chat-container{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.chat-header-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.chat-header-name{font-size:14px;font-weight:600;}
.chat-header-sub{font-size:11px;color:var(--muted2);}
.chat-messages{padding:16px;min-height:80px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.chat-msg{display:flex;gap:8px;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;max-width:88%;}
.chat-msg.ai .chat-bubble{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px 16px 16px 16px;}
.chat-msg.user .chat-bubble{background:rgba(124,106,255,0.2);border:1px solid rgba(124,106,255,0.3);border-radius:16px 4px 16px 16px;}
.chat-typing{display:flex;gap:4px;align-items:center;padding:10px 14px;}
.chat-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted2);animation:typing 1.4s infinite;}
.chat-typing span:nth-child(2){animation-delay:0.2s;}
.chat-typing span:nth-child(3){animation-delay:0.4s;}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(0.85);}30%{opacity:1;transform:scale(1);}}
.chat-input-area{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text);font-size:14px;font-family:var(--font-body);padding:10px 14px;outline:none;transition:border-color 0.2s;}
.chat-input:focus{border-color:var(--accent);}
.chat-input::placeholder{color:var(--muted);}
.chat-input:disabled{opacity:0.4;cursor:not-allowed;}
.chat-send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:opacity 0.15s;}
.chat-send-btn:active{opacity:0.8;}
.chat-send-btn:disabled{opacity:0.35;cursor:not-allowed;}

/* API KEY */
.api-key-card{background:rgba(124,106,255,0.07);border:1px solid rgba(124,106,255,0.2);border-radius:14px;padding:16px;margin-bottom:12px;}
.api-key-title{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--accent);}
.api-key-desc{font-size:12px;color:var(--muted2);margin-bottom:12px;line-height:1.5;}
.api-key-desc a{color:var(--accent);}
.api-key-row{display:flex;gap:8px;}
.api-key-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--text);font-size:13px;font-family:var(--font-mono);padding:10px 12px;outline:none;min-width:0;}
.api-key-input:focus{border-color:var(--accent);}
.api-key-save{background:var(--accent);border:none;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body);white-space:nowrap;}

/* MISC BUTTONS */
/* .delete-btn defined above in theme block with 44×44 tap targets */

/* FREQUENCY BADGE */
.freq-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(255,209,102,0.12);border:1px solid rgba(255,209,102,0.22);border-radius:6px;padding:1px 6px;font-size:9px;font-family:var(--font-mono);color:var(--accent4);flex-shrink:0;letter-spacing:0.02em;}
.freq-badge.var{background:rgba(124,106,255,0.12);border-color:rgba(124,106,255,0.22);color:var(--accent);}
/* GROSS-NET SECTION */
.gn-toggle{background:none;border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--muted2);font-size:12px;font-family:var(--font-mono);padding:8px 12px;cursor:pointer;width:100%;text-align:left;margin-bottom:10px;transition:border-color 0.15s,color 0.15s;display:flex;align-items:center;justify-content:space-between;}
.gn-toggle:active{border-color:var(--accent4);}
.gn-body{background:rgba(255,209,102,0.05);border:1px solid rgba(255,209,102,0.15);border-radius:12px;padding:14px;margin-bottom:12px;}
.gn-result{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.07);}
.gn-net-val{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--accent2);}
.gn-use-btn{background:rgba(62,207,142,0.15);border:1px solid rgba(62,207,142,0.3);color:var(--accent2);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--font-mono);}
.gn-use-btn:active{background:rgba(62,207,142,0.28);}
/* VARIABLE OVERRIDE */
.var-override-box{background:rgba(124,106,255,0.06);border:1px solid rgba(124,106,255,0.2);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.var-override-label{font-size:11px;color:var(--accent);font-family:var(--font-mono);margin-bottom:8px;letter-spacing:0.05em;}
.add-btn{background:none;border:2px dashed rgba(255,255,255,0.12);border-radius:12px;padding:13px;color:var(--muted2);font-size:13px;cursor:pointer;width:100%;text-align:center;font-family:var(--font-body);transition:border-color 0.15s,color 0.15s;}
.add-btn:active{border-color:var(--accent);color:var(--accent);}
.apply-all-btn{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px;color:var(--muted2);font-size:12px;cursor:pointer;font-family:var(--font-mono);letter-spacing:0.05em;margin-top:6px;transition:background 0.15s;}
.apply-all-btn:active{background:rgba(255,255,255,0.09);}

/* MISC */
.highlight-box{background:rgba(124,106,255,0.07);border:1px solid rgba(124,106,255,0.2);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--muted2);margin-top:16px;line-height:1.5;}
.highlight-box strong{color:var(--text);}
.warn-box{background:rgba(255,209,102,0.07);border:1px solid rgba(255,209,102,0.2);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--muted2);line-height:1.5;}
.warn-box strong{color:var(--accent4);}

/* ACCOUNT SETTINGS CARD */
.account-cfg-card{background:var(--card);border:1px solid rgba(62,207,142,0.3);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:14px;gap:12px;transition:border-color 0.2s;}
.account-cfg-card:active{border-color:rgba(62,207,142,0.6);}
.account-cfg-left{flex:1;min-width:0;}
.account-cfg-name{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--accent2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.account-cfg-detail{font-size:11px;color:var(--muted2);margin-top:3px;font-family:var(--font-mono);}
.account-cfg-icon{font-size:18px;color:var(--muted);flex-shrink:0;}

/* ANNUAL LIMIT BAR */
.limit-bar-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:10px;}
.limit-bar-label{font-size:11px;color:var(--muted2);font-family:var(--font-mono);margin-bottom:8px;}
.limit-bar-track{height:10px;border-radius:5px;background:rgba(255,255,255,0.07);overflow:hidden;margin-bottom:6px;}
.limit-bar-fill{height:100%;border-radius:5px;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.limit-bar-fill.under{background:var(--accent2);}
.limit-bar-fill.over{background:var(--accent3);}
.limit-bar-pct{font-family:var(--font-mono);font-size:13px;font-weight:600;}

/* ACCOUNT TYPE GRID */
.acct-type-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.acct-type-btn{background:rgba(255,255,255,0.05);border:2px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;font-family:var(--font-mono);cursor:pointer;transition:all 0.15s;color:var(--muted2);}
.acct-type-btn:active{opacity:0.7;}
.acct-type-btn.selected{border-color:var(--accent2);background:rgba(62,207,142,0.12);color:var(--accent2);}

/* TOGGLE ROW */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.toggle-row:last-of-type{border-bottom:none;}
.toggle-label{font-size:13px;color:var(--muted2);}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:rgba(255,255,255,0.12);border-radius:24px;transition:background 0.2s;}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:transform 0.2s;}
.toggle-switch input:checked+.toggle-slider{background:var(--accent2);}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px);}

/* TOAST NOTIFICATION */
#backup-toast{position:fixed;top:env(safe-area-inset-top,0);left:50%;transform:translateX(-50%) translateY(-120%);z-index:9999;background:#252535;border:1px solid rgba(124,106,255,0.4);border-radius:14px;padding:12px 18px;font-size:13px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);width:max-content;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);}
#backup-toast.show{transform:translateX(-50%) translateY(calc(env(safe-area-inset-top,0px) + 12px));}
.toast-icon{font-size:18px;flex-shrink:0;}
.toast-text{flex:1;line-height:1.4;}
.toast-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0;}

/* EXPORT SECTION */
.export-btn{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:13px 16px;color:var(--text);font-size:13px;font-family:var(--font-body);cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:background 0.15s,border-color 0.15s;}
.export-btn:active{background:rgba(255,255,255,0.1);}
.export-btn-icon{font-size:18px;flex-shrink:0;}
.export-btn-info{flex:1;}
.export-btn-title{font-weight:600;font-size:13px;}
.export-btn-sub{font-size:11px;color:var(--muted2);margin-top:2px;}
.export-btn.green{border-color:rgba(62,207,142,0.25);background:rgba(62,207,142,0.06);}
.export-btn.green:active{background:rgba(62,207,142,0.14);}
.export-btn.purple{border-color:rgba(124,106,255,0.25);background:rgba(124,106,255,0.06);}
.export-btn.purple:active{background:rgba(124,106,255,0.14);}
.export-btn.yellow{border-color:rgba(255,209,102,0.25);background:rgba(255,209,102,0.06);}
.export-btn.yellow:active{background:rgba(255,209,102,0.14);}
.export-btn.blue{border-color:rgba(78,205,196,0.25);background:rgba(78,199,196,0.06);}
.export-btn.blue:active{background:rgba(78,205,196,0.14);}
#import-file-input{display:none;}
.import-error{color:var(--accent3);font-size:12px;padding:8px 12px;background:rgba(255,107,107,0.08);border-radius:8px;border:1px solid rgba(255,107,107,0.2);margin-top:-4px;margin-bottom:8px;display:none;}

/* GOAL CARDS */
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;transition:border-color 0.2s;}
.goal-card:active{border-color:rgba(255,255,255,0.18);}
.goal-card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.goal-emoji{font-size:22px;line-height:1;flex-shrink:0;}
.goal-name{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.goal-achieved-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(62,207,142,0.18);border:1px solid rgba(62,207,142,0.35);border-radius:20px;padding:3px 9px;font-size:11px;font-family:var(--font-mono);color:var(--accent2);flex-shrink:0;}
.goal-progress-track{height:8px;border-radius:4px;background:rgba(255,255,255,0.07);overflow:hidden;margin-bottom:8px;}
.goal-progress-fill{height:100%;border-radius:4px;transition:width 0.7s cubic-bezier(0.34,1.56,0.64,1);}
.goal-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted2);font-family:var(--font-mono);}
.goal-amounts{display:flex;align-items:center;gap:4px;}
.goal-pct{color:var(--muted);font-family:var(--font-mono);font-size:11px;}
.goal-eta{font-size:11px;color:var(--muted2);font-family:var(--font-mono);}
.goal-add-btn{background:none;border:2px dashed rgba(255,255,255,0.12);border-radius:14px;padding:14px;color:var(--muted2);font-size:13px;cursor:pointer;width:100%;text-align:center;font-family:var(--font-body);transition:border-color 0.15s,color 0.15s;}
.goal-add-btn:active{border-color:var(--accent2);color:var(--accent2);}

/* EMOJI PICKER */
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px;}
.emoji-opt{background:rgba(255,255,255,0.05);border:2px solid transparent;border-radius:10px;padding:8px 4px;text-align:center;font-size:20px;cursor:pointer;transition:all 0.15s;line-height:1;}
.emoji-opt:active{opacity:0.7;}
.emoji-opt.sel-emoji{border-color:var(--accent);background:rgba(124,106,255,0.15);}

/* COLOR SWATCHES */
.color-swatches{display:flex;gap:10px;margin-bottom:12px;}
.color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s,transform 0.15s;}
.color-swatch:active{transform:scale(0.9);}
.color-swatch.sel-color{border-color:#fff;}

/* GOAL BUDGET LINE */
.goal-budget-line{padding:9px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.04);}
.goal-budget-line:last-child{border-bottom:none;}

/* CONFETTI */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{0%{transform:translateY(0) rotateZ(0deg) rotateX(0deg);opacity:1;}100%{transform:translateY(110vh) rotateZ(720deg) rotateX(360deg);opacity:0;}}

.eur-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-top:10px;}
.eur-card:active{border-color:rgba(255,255,255,0.18);}
.eur-left{font-size:13px;color:var(--muted2);}
.eur-right{font-family:var(--font-mono);font-size:15px;color:var(--accent4);}
.eur-refresh-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;color:var(--muted2);font-size:14px;padding:4px 9px;cursor:pointer;line-height:1;transition:background 0.15s,color 0.15s;flex-shrink:0;}
.eur-refresh-btn:active{background:rgba(62,207,142,0.15);color:var(--accent2);}
.eur-refresh-btn.spinning{animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-row{padding:12px 16px;font-size:13px;color:var(--muted);}
.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-family:var(--font-mono);border:1px solid;}
.tag-chip.now{background:rgba(62,207,142,0.1);border-color:rgba(62,207,142,0.3);color:var(--accent2);}
.tag-chip.other{background:rgba(255,255,255,0.04);border-color:var(--border);color:var(--muted);}

/* BOTTOM SHEET */
#sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;transition:height 0.05s,top 0.05s;}
#sheet-overlay.open{display:flex;}
#bottom-sheet{background:#1a1a26;border-radius:20px 20px 0 0;width:100%;max-width:500px;margin:0 auto;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);display:flex;flex-direction:column;max-height:90dvh;}
#sheet-overlay.open #bottom-sheet{transform:translateY(0);}
#sheet-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 8px;}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:14px auto 20px;}
.sheet-title{font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:20px;}
.sheet-label{font-size:12px;color:var(--muted2);margin-bottom:6px;font-family:var(--font-mono);}
.sheet-input{width:100%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text);font-size:16px;font-family:var(--font-body);padding:13px 14px;outline:none;margin-bottom:12px;display:block;transition:border-color 0.2s,box-shadow 0.2s;}
.sheet-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,255,0.15);}
.sheet-input::placeholder{color:var(--muted);}
select.sheet-input{-webkit-appearance:none;appearance:none;cursor:pointer;}
.sheet-hint{background:rgba(124,106,255,0.07);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted2);margin-bottom:14px;line-height:1.6;}
.sheet-hint strong{color:var(--accent4);}
.sheet-btns{display:flex;gap:10px;flex-shrink:0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,0.06);background:#1a1a26;}
.sheet-cancel{flex:1;background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--muted2);border-radius:12px;padding:13px;font-size:15px;cursor:pointer;font-family:var(--font-body);}
.sheet-save{flex:2;background:var(--accent);border:none;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-body);}
.sheet-save:active{opacity:0.85;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeUp 0.35s ease both;}

#onboarding-overlay{position:fixed;inset:0;background:rgba(10,10,15,0.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity 0.35s;pointer-events:none;}
#onboarding-overlay.open{opacity:1;pointer-events:all;}
#onboarding-card{width:100%;max-width:500px;background:#1a1a26;border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-height:94dvh;overflow:hidden;transform:translateY(60px);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);}
#onboarding-overlay.open #onboarding-card{transform:translateY(0);}
#wizard-progress{display:flex;justify-content:center;gap:8px;padding:18px 24px 0;flex-shrink:0;}
.wiz-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.14);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.wiz-dot.active{background:var(--accent);width:26px;border-radius:4px;}
.wiz-dot.done{background:var(--accent2);}
#wizard-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 22px 8px;}
#wizard-body::-webkit-scrollbar{width:3px;}
#wizard-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
#wizard-footer{display:flex;align-items:center;justify-content:space-between;padding:14px 22px calc(20px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,0.06);background:#1a1a26;flex-shrink:0;}
.wiz-skip-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:var(--font-body);padding:8px 4px;}
.wiz-nav-btns{display:flex;gap:10px;}
.wiz-back-btn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--muted2);border-radius:12px;padding:12px 20px;font-size:14px;cursor:pointer;font-family:var(--font-body);transition:background 0.15s;}
.wiz-back-btn:active{background:rgba(255,255,255,0.13);}
.wiz-next-btn{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:12px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:opacity 0.15s;}
.wiz-next-btn:active{opacity:0.82;}
.wiz-start-btn{width:100%;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);border:none;color:#fff;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--font-head);margin-top:8px;letter-spacing:-0.01em;transition:opacity 0.15s;}
.wiz-start-btn:active{opacity:0.85;}
.wiz-headline{font-family:var(--font-head);font-size:24px;font-weight:800;letter-spacing:-0.02em;margin:22px 0 6px;line-height:1.25;}
.wiz-sub{font-size:14px;color:var(--muted2);margin-bottom:22px;line-height:1.55;}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.lang-opt{background:rgba(255,255,255,0.04);border:2px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;transition:all 0.18s;}
.lang-opt:active{opacity:0.75;}
.lang-opt.selected{border-color:var(--accent);background:rgba(124,106,255,0.12);}
.lang-opt .lo-flag{font-size:28px;display:block;margin-bottom:6px;}
.lang-opt .lo-name{font-size:13px;font-weight:600;}
.curr-opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.curr-chip{background:rgba(255,255,255,0.06);border:2px solid var(--border);border-radius:10px;padding:8px 14px;font-size:15px;font-family:var(--font-mono);cursor:pointer;transition:all 0.15s;}
.curr-chip:active{opacity:0.7;}
.curr-chip.selected{border-color:var(--accent);background:rgba(124,106,255,0.15);color:var(--accent);}
.wiz-inc-row{display:flex;gap:8px;margin-bottom:8px;}
.wiz-add-link{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;font-family:var(--font-body);padding:6px 0;display:block;margin-top:2px;}
.wiz-exp-slot{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}

.wiz-exp-info{flex:1;min-width:0;}

</nav>
<div id="sheet-overlay">

      <div id="sheet-body"></div>

    <div class="sheet-btns">

</div>

<!-- BACKUP TOAST -->
<div id="backup-toast">

</div>
<input type="file" id="import-file-input" accept=".json">

  </div>
</div>

function applyTheme(){
  const theme=state.settings?.theme||'system';
  let resolved=theme;
  if(theme==='system') resolved=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  const cl=document.documentElement.classList;
  cl.remove('light','dark');
  cl.add(resolved);
}
function applyFontSize(){
  const sizes={S:13,M:15,L:17,XL:19};
  document.documentElement.style.fontSize=(sizes[state.settings?.fontSize||'M']||15)+'px';
}
const PALETTES={
  default:     {accent:'',accent2:'#3ecf8e',accent3:'#ff6b6b',accent4:'#ffd166',accent5:'#ff9f43'},
  deuteranopia:{accent:'',accent2:'#0077bb',accent3:'#ee7733',accent4:'#ffd166',accent5:'#ff9f43'},
  protanopia:  {accent:'',accent2:'#0099cc',accent3:'#ee3377',accent4:'#ffd166',accent5:'#ff9f43'},
  monochrome:  {accent:'#888888',accent2:'#aaaaaa',accent3:'#555555',accent4:'#cccccc',accent5:'#999999'},
};
function applyColorPalette(){
  const p=PALETTES[state.settings?.colorPalette||'default']||PALETTES.default;
  const r=document.documentElement;
  if(p.accent)r.style.setProperty('--accent',p.accent);else r.style.removeProperty('--accent');
  r.style.setProperty('--accent2',p.accent2);
  r.style.setProperty('--accent3',p.accent3);
  r.style.setProperty('--accent4',p.accent4);
  r.style.setProperty('--accent5',p.accent5);
}
let _reduceMotion=false;
function applyReduceMotion(){
  _reduceMotion=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(_reduceMotion){
    let s=document.getElementById('_rmStyle');
    if(!s){s=document.createElement('style');s.id='_rmStyle';document.head.appendChild(s);}
    s.textContent='*{transition-duration:0.01ms!important;animation-duration:0.01ms!important;}.fade-in{animation:none!important;}';
  }
}
function applyAllAccessibility(){
  applyTheme();applyFontSize();applyColorPalette();applyReduceMotion();
}

window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{

function createMonth(n) {
  return {
    month:n,
    income:BASE_INCOME.map(x=>({...x})),
    expenses:BASE_EXPENSES.map(x=>({...x})),
    invested:0,vwce:0,emergency:0,note:'',
    assets:{bank:0,cashHUF:0,cashEUR:0,portfolio:0}
  };
}

function createYear(year) {
  const months = Array.from({length:12},(_,i)=>createMonth(i+1));
  return {months};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){state=JSON.parse(raw);migrateState();}
    else initDefault();
  } catch(e){initDefault();}
}

function initDefault() {
  state = {
    currentYear:2026,
    currentMonth:_NOW.getMonth()+1,
    secondaryCurrency:null,
    geminiKey:'',
    years:{'2026':createYear(2026)},
    calculator:{monthly:16000,rate:7,years:20},
    settings:{language:'hu',currencySymbol:'Ft',currencyCode:'HUF',theme:'system',fontSize:'M',colorPalette:'default'},
    investmentConfig:{name:'VWCE ETF',ticker:'VWCE',expectedReturn:7,note:'DCA strategy · TBSZ'},
    investmentAccount:{type:'tbsz',name:'TBSZ',taxFree:true,annualLimit:null,lockupYears:5,note:'Tax-free after 5 years'},
    onboardingComplete:false,
    goals:[],
    variableIncomeOverrides:{}
  };
}

function migrateState() {
  if(!state.currentMonth) state.currentMonth = _NOW.getMonth()+1;
  if(!state.geminiKey) state.geminiKey = '';
  if(!state.saveCount) state.saveCount = 0;
  if(!state.calculator) state.calculator = {monthly:16000,rate:7,years:20};
  if(!state.settings) state.settings={language:'hu',currencySymbol:'Ft',currencyCode:'HUF',theme:'system',fontSize:'M',colorPalette:'default'};
  if(!state.settings.language) state.settings.language='hu';
  if(!state.settings.currencySymbol) state.settings.currencySymbol='Ft';
  if(!state.settings.theme) state.settings.theme='system';
  if(!state.settings.fontSize) state.settings.fontSize='M';
  if(!state.settings.colorPalette) state.settings.colorPalette='default';
  // Migrate old eurRate → secondaryCurrency
  if(state.eurRate && !state.secondaryCurrency) {
    state.secondaryCurrency = {
      code:'EUR', symbol:'€', name:'Euro',
      rate: state.eurRate,
      rateLastFetched: state.eurRateLastFetched||null,
      rateLive: state.eurRateLive||false
    };
    delete state.eurRate;
    delete state.eurRateLastFetched;
    delete state.eurRateLive;
  }
  if(state.secondaryCurrency===undefined) state.secondaryCurrency=null;
  // Add currencyCode to settings if missing (guess from symbol)
  if(!state.settings.currencyCode) {
    const sym=state.settings.currencySymbol||'Ft';
    state.settings.currencyCode = sym==='Ft'?'HUF':sym==='€'?'EUR':sym==='$'?'USD':sym==='£'?'GBP':sym==='₹'?'INR':'';
  }
  if(!state.investmentConfig) state.investmentConfig={name:'VWCE ETF',ticker:'VWCE',expectedReturn:7,note:'DCA strategy · TBSZ'};
  if(!state.investmentConfig.ticker) state.investmentConfig.ticker='';
  if(!state.investmentAccount) state.investmentAccount={type:'tbsz',name:'TBSZ',taxFree:true,annualLimit:null,lockupYears:5,note:'Tax-free after 5 years'};
  if(state.investmentAccount.taxFree===undefined) state.investmentAccount.taxFree=true;
  if(!state.goals) state.goals=[];
  if(!state.variableIncomeOverrides) state.variableIncomeOverrides={};
  // Migrate income items: ensure frequency and isVariable fields exist
  for(const y of Object.keys(state.years)){
    const yd=state.years[y];
    if(yd.months) yd.months.forEach(m=>{
      if(m.income) m.income.forEach(it=>{
        if(!it.frequency) it.frequency='monthly';
        if(it.isVariable===undefined) it.isVariable=false;
      });
    });
  }
  // Existing users: mark onboarding as complete (they already know the app)
  if(state.onboardingComplete===undefined) state.onboardingComplete=true;
  // Sync calculator rate to investmentConfig if calculator was at default
  if(state.calculator.rate===7&&state.investmentConfig.expectedReturn!==7) state.calculator.rate=state.investmentConfig.expectedReturn;
  for(const y of Object.keys(state.years)){
    const yd = state.years[y];
    // Migrate year-level assets → per-month assets
    if(yd.assets && yd.months && yd.months[0] && !yd.months[0].assets){
      yd.months.forEach(m=>{ m.assets={...yd.assets}; });
      delete yd.assets;
    }
    // Ensure every month has an assets object
    if(yd.months) yd.months.forEach(m=>{ if(!m.assets) m.assets={bank:0,cashHUF:0,cashEUR:0,portfolio:0}; });
    // Migrate old format (year-level income/expenses) to per-month
    if(yd.months && yd.months[0] && !yd.months[0].income){
      const oldInc = yd.income||BASE_INCOME;
      const oldExp = yd.expenses||BASE_EXPENSES;
      yd.months.forEach(m=>{
        m.income = oldInc.map(x=>({...x}));
        m.expenses = oldExp.map(x=>({...x}));
        if(m.vwce===undefined) m.vwce=m.invested;
        if(m.emergency===undefined) m.emergency=0;
      });
      delete yd.income; delete yd.expenses; delete yd.summerIncome;
    }
  }
}

function saveState(){
  state.saveCount=(state.saveCount||0)+1;
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  if(state.saveCount>0&&state.saveCount%10===0){
    const msg=getLang()==='hu'
      ?'💾 Érdemes exportálni a biztonsági mentést — Beállítások → Export'
      :'💾 Consider exporting a backup — Settings → Export';
    showToast(msg);
  }
}

/* Income helpers – frequency normalisation */
function freqMultiplier(freq){
  if(freq==='weekly')return 52/12;
  if(freq==='biweekly')return 26/12;
  return 1; // monthly or variable
}
function getVarOverride(incId,year,monthNum){
  const yo=(state.variableIncomeOverrides||{})[year||state.currentYear];
  if(!yo)return null;
  const mo=yo[monthNum];
  if(!mo)return null;
  return mo[incId]!==undefined?mo[incId]:null;
}
function setVarOverride(incId,year,monthNum,val){
  if(!state.variableIncomeOverrides)state.variableIncomeOverrides={};
  const y=String(year||state.currentYear);
  if(!state.variableIncomeOverrides[y])state.variableIncomeOverrides[y]={};
  if(!state.variableIncomeOverrides[y][monthNum])state.variableIncomeOverrides[y][monthNum]={};
  if(val===null||val===undefined)delete state.variableIncomeOverrides[y][monthNum][incId];
  else state.variableIncomeOverrides[y][monthNum][incId]=val;
}
function incMonthlyAmt(it,year,monthNum){
  if(it.isVariable){
    const ov=getVarOverride(it.id,year,monthNum);
    return ov!==null?ov:it.amount;
  }
  return Math.round(it.amount*freqMultiplier(it.frequency||'monthly'));
}
function mInc(m){
  return m.income.reduce((s,i)=>s+incMonthlyAmt(i,state.currentYear,m.month),0);
}
function mCore(m){return m.expenses.filter(e=>e.category==='Core').reduce((s,e)=>s+e.amount,0);}
function mChoice(m){return m.expenses.filter(e=>e.category==='Choice').reduce((s,e)=>s+e.amount,0);}
function mExp(m){return mCore(m)+mChoice(m);}
function mRemain(m){return mInc(m)-mExp(m)-m.invested;}
function yearInv(){return getYD().months.reduce((s,m)=>s+m.invested,0);}

function fmt(n){const sym=getCurrSym();const loc=getLocale();return new Intl.NumberFormat(loc,{minimumFractionDigits:0,maximumFractionDigits:0}).format(Number(n))+'\u00a0'+sym;}
function fmtS(n){n=Number(n);const sym=getCurrSym();const isHu=getLocale()==='hu-HU';if(n>=1000000)return(n/1000000).toFixed(1).replace(isHu?'.':'-', isHu?',':'.')+'\u00a0M';if(n>=1000)return(n/1000).toFixed(0)+(isHu?'e':'k');return String(Math.round(n));}
function fmtM(n){const isHu=getLocale()==='hu-HU';return(n/1000000).toFixed(1).replace(isHu?'.':'-',isHu?',':'.')+'\u00a0M\u00a0'+getCurrSym();}
function fmtP(n){return n.toFixed(1).replace('.',getLocale()==='hu-HU'?',':'.')+'\u00a0%';}
function fv(monthly,rate,years){const r=rate/100/12,n=years*12;if(r===0)return monthly*n;return monthly*((Math.pow(1+r,n)-1)/r);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function mmScore(pct){
  if(pct>=20)return{score:3,label:t('great'),emoji:'🟢',cls:'green'};
  if(pct>=10)return{score:2,label:t('okay'),emoji:'🟡',cls:'yellow'};
  if(pct>=5) return{score:1,label:t('needsWork'),emoji:'🟠',cls:'orange'};
  return{score:0,label:t('weak'),emoji:'🔴',cls:'red'};
}
function scoreColor(cls){
  return cls==='green'?'var(--accent2)':cls==='yellow'?'var(--accent4)':cls==='orange'?'var(--accent5)':'var(--accent3)';
}

document.getElementById('prev-month').addEventListener('click',()=>{
  if(state.currentMonth>1){state.currentMonth--;}
  else {
    const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
    const idx=yrs.indexOf(state.currentYear);
    if(idx>0){state.currentYear=yrs[idx-1];state.currentMonth=12;}else return;
  }
  saveState();updateHeader();renderCurrent();
});
document.getElementById('next-month').addEventListener('click',()=>{
  if(state.currentMonth<12){state.currentMonth++;}
  else {
    const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
    const idx=yrs.indexOf(state.currentYear);
    if(idx<yrs.length-1){state.currentYear=yrs[idx+1];state.currentMonth=1;}
    else{makeNewYear();state.currentMonth=1;}
  }
  saveState();updateHeader();renderCurrent();
});
document.getElementById('month-display').addEventListener('click',()=>{
  state.currentYear=_NOW.getFullYear();
  state.currentMonth=_NOW.getMonth()+1;
  if(!state.years[String(state.currentYear)])state.years[String(state.currentYear)]=createYear(state.currentYear);
  saveState();updateHeader();renderCurrent();
});
function makeNewYear(){
  const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
  const maxY=Math.max(...yrs);
  const ny=maxY+1;
  const prev=state.years[String(maxY)];
  const lastM=prev.months[11];
  const carry=lastM.assets.portfolio+yearInv();
  state.years[String(ny)]=createYear(ny);
  const nyd=state.years[String(ny)];
  nyd.months.forEach(m=>{
    m.income=lastM.income.map(x=>({...x}));
    m.expenses=lastM.expenses.map(x=>({...x}));
    m.assets={...lastM.assets,portfolio:carry};
  });
  state.currentYear=ny;
}

function renderGoalCards(){
  if(!state.goals||state.goals.length===0){
    return`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px">🎯 ${t('noGoals')}</div>`;

  let hasNewlyAchieved=false;
  const cards=state.goals.map(g=>{
    const pct=g.targetAmount>0?Math.min(100,g.currentAmount/g.targetAmount*100):0;
    const achieved=g.currentAmount>=g.targetAmount&&g.targetAmount>0;
    if(achieved&&!g._celebrated){hasNewlyAchieved=true;g._celebrated=true;}
    const remaining=Math.max(0,g.targetAmount-g.currentAmount);
    const monthsLeft=g.monthlyContribution>0?Math.ceil(remaining/g.monthlyContribution):null;
    const etaStr=achieved?''
      :monthsLeft!==null?`~${monthsLeft} ${t('goalMonthsLeft')} ${t('goalAtRate')} ${fmt(g.monthlyContribution)}${t('goalPerMonth')}`
      :(g.targetDate?`${t('goalTargetLabel')}: ${g.targetDate}`:'');

    return`<div class="goal-card" style="margin-bottom:10px;border-left:3px solid ${escH(g.color||'#7c6aff')}" onclick="editGoal(${g.id})">

    if(acct.annualLimit) parts.push(getLang()==='hu'?`Limit: ${fmt(acct.annualLimit)}`:`Limit: ${fmt(acct.annualLimit)}`);
    return parts.join(' · ');
  })();

  const limitBarHtml=(()=>{

  </div>

    <div class="account-cfg-left">
      <div class="account-cfg-name">🏦 ${escH(acctName)}</div>
      <div class="account-cfg-detail">${escH(acctSubDetail)}${acct.note?' · '+escH(acct.note):''}</div>
    </div>
    <span class="account-cfg-icon">⚙</span>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-label">${t('investedYear')} ${state.currentYear}</div><div class="card-value purple">${fmtS(yInv)}</div><div class="card-sub">${fmt(yInv)}</div></div>
    <div class="card"><div class="card-label">${t('activeMonthsFull')}</div><div class="card-value purple">${actM}</div><div class="card-sub">${t('months12')}</div></div>

  <div class="section-label">${t('compoundCalc')}</div>
  <div class="calc-card">
    <div class="slider-group"><div class="slider-top"><span class="slider-label">${t('monthlyInv')}</span><span class="slider-val" id="sv-monthly">${fmt(c.monthly)}</span></div><input type="range" id="sl-monthly" min="5000" max="100000" step="1000" value="${c.monthly}" oninput="updateCalc()"></div>

    <button class="sync-btn" onclick="syncCalc()">${t('syncFromPlan')}</button>
  </div>
  <div class="grid-3" id="calc-stats"></div>
  <div class="section-label" style="margin-top:16px">${t('growthChart')} · ${c.years} ${t('years')}</div>

      <span class="legend-item"><span class="legend-dot" style="background:rgba(124,106,255,0.7)"></span>${t('paid')}</span>

  <div class="milestone-grid" id="calc-milestones"></div>

  <div class="section-label" style="margin-top:16px">${t('monthlyPlan')}</div>
  ${rows}
  <div class="highlight-box">
    🎯 <strong>${t('strategy')}:</strong> ${escH(strategyStr)}<br><span style="display:inline-block;margin-top:6px">🏦 <strong>${escH(acctName)}</strong> · ${escH(acctSubDetail)}</span>${state.secondaryCurrency?`<br><span style="display:inline-block;margin-top:6px">1 ${escH(state.secondaryCurrency.symbol)} ≈ <strong style="color:var(--accent4)">${fmt(Math.round(state.secondaryCurrency.rate))}</strong></span>`:''}
  </div>
  <div class="warn-box" style="margin-top:10px">${warnStr.replace(/TBSZ/g, acctName)}</div>
</div>`;
  buildCalcChart();updateCalcUI();
}

function updateCalc(){
  const m=parseInt(document.getElementById('sl-monthly')?.value)||state.calculator.monthly;
  const r=parseFloat(document.getElementById('sl-rate')?.value)||state.calculator.rate;
  const y=parseInt(document.getElementById('sl-years')?.value)||state.calculator.years;
  state.calculator={monthly:m,rate:r,years:y};saveState();updateCalcUI();buildCalcChart();
}
function updateCalcUI(){
  const{monthly,rate,years}=state.calculator;
  const g=id=>document.getElementById(id);
  if(!g('sv-monthly'))return;
  g('sv-monthly').textContent=fmt(monthly);
  g('sv-rate').textContent=rate+'%';
  g('sv-years').textContent=years+' '+t('years');
  const total=fv(monthly,rate,years),invested=monthly*years*12,gain=total-invested;
  const s=g('calc-stats');
  if(s)s.innerHTML=`<div class="stat-card"><div class="stat-label">${t('paid')}</div><div class="stat-value purple">${fmtS(invested)}</div></div><div class="stat-card"><div class="stat-label">${t('gain')}</div><div class="stat-value green">${fmtS(gain)}</div></div><div class="stat-card"><div class="stat-label">${t('total2')}</div><div class="stat-value yellow">${fmtS(total)}</div></div>`;
  const ms=g('calc-milestones');
  if(ms)ms.innerHTML=[5,10,20,30].map(y=>`<div class="milestone-card"><div class="milestone-label">${y} ${t('years')}</div><div class="milestone-value">${fmtM(fv(monthly,rate,y))}</div><div class="milestone-sub">${fmtS(fv(monthly,rate,y))}</div></div>`).join('');
}
function buildCalcChart(){
  const canvas=document.getElementById('growthChart');if(!canvas)return;
  if(charts.growth){charts.growth.destroy();delete charts.growth;}
  const{monthly,rate,years}=state.calculator;
  const labels=[],principal=[],gains=[];
  for(let y=1;y<=years;y++){const t=fv(monthly,rate,y),inv=monthly*y*12;labels.push(y+'');principal.push(Math.round(inv));gains.push(Math.round(t-inv));}
  charts.growth=new Chart(canvas.getContext('2d'),{type:'bar',data:{labels,datasets:[{label:t('paid'),data:principal,backgroundColor:'rgba(124,106,255,0.7)',stack:'a',borderRadius:2},{label:t('gain'),data:gains,backgroundColor:'rgba(62,207,142,0.7)',stack:'a',borderRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:chartBg(),titleColor:chartText(),bodyColor:chartText(),callbacks:{label:ctx=>' '+Math.round(ctx.raw).toLocaleString(getLocale())+'\u00a0'+getCurrSym()}}},scales:{x:{stacked:true,ticks:{color:chartText(),autoSkip:true,maxTicksLimit:10},grid:{display:false}},y:{stacked:true,ticks:{color:chartText(),callback:v=>(v/1000000).toFixed(1)+'M'},grid:{color:chartGrid()}}}}});
}
function syncCalc(){
  const yd=getYD(),wi=yd.months.filter(m=>m.invested>0);
  if(!wi.length)return;
  const avg=Math.round(wi.reduce((s,m)=>s+m.invested,0)/wi.length/1000)*1000;
  const cl=Math.min(100000,Math.max(5000,avg));
  const sl=document.getElementById('sl-monthly');if(sl)sl.value=cl;
  state.calculator.monthly=cl;
  // Also sync rate from investmentConfig
  const configRate=state.investmentConfig.expectedReturn;
  state.calculator.rate=configRate;
  const slr=document.getElementById('sl-rate');if(slr)slr.value=configRate;
  saveState();updateCalcUI();buildCalcChart();
}

============================================================ */
function genInsights(){
  const yd=getYD(),ms=yd.months,mwi=ms.filter(m=>mInc(m)>0),mwv=ms.filter(m=>m.invested>0);
  const curAssets=getMD().assets;
  const insights=[];
  const avgComp=mwi.length>0?mwi.map(m=>m.invested/mInc(m)*100).reduce((a,b)=>a+b,0)/mwi.length:0;
  const avgInc=mwi.length>0?mwi.reduce((s,m)=>s+mInc(m),0)/mwi.length:68000;

  // 1. Compound ratio
  if(avgComp>=20)insights.push({e:'🚀',t:'success',title:t('ins1t_great'),text:getLang()==='hu'?`Átlagos ${avgComp.toFixed(1)}%-os Compound arányod van idén – meghaladod a 20%-os Vincent Chan célt. Tartsd meg ezt a tempót!`:`Your average Compound ratio is ${avgComp.toFixed(1)}% this year – you're beating the 20% Vincent Chan target. Keep it up!`});
  else if(avgComp>=10)insights.push({e:'📈',t:'info',title:t('ins1t_good'),text:getLang()==='hu'?`${avgComp.toFixed(1)}% az átlagos befektetési arányod. A 20%-os cél eléréséhez havonta kb. ${fmt(Math.round(avgInc*0.2))} lenne ideális.`:`Your average investment rate is ${avgComp.toFixed(1)}%. To reach the 20% target, aim for around ${fmt(Math.round(avgInc*0.2))}/month.`});
  else if(avgComp>0)insights.push({e:'💡',t:'warning',title:t('ins1t_low'),text:getLang()==='hu'?`Jelenlegi átlag: ${avgComp.toFixed(1)}%. Apró lépésekkel is el lehet jutni a 20%-os célig!`:`Current average: ${avgComp.toFixed(1)}%. Small steps still get you to the 20% goal – consistency beats amount!`});
  else insights.push({e:'🌱',t:'warning',title:t('ins1t_none'),text:getLang()==='hu'?`Még nincs tervezett befektetés. A korai kezdés a legnagyobb előny – akár havi 5-10e Ft is exponenciálisan nő.`:`No investment planned yet. Starting early is the biggest advantage – even a small monthly amount grows exponentially.`});

  // 2. Dining
  const avgRest=ms.map(m=>m.expenses.filter(e=>e.name.toLowerCase().includes('vendég')||e.name.toLowerCase().includes('étterem')||e.name.toLowerCase().includes('resto')||e.name.toLowerCase().includes('dining')||e.name.toLowerCase().includes('restaurant')).reduce((s,e)=>s+e.amount,0)).reduce((a,b)=>a+b,0)/12;
  const restPct=avgInc>0?avgRest/avgInc*100:0;
  if(restPct>25)insights.push({e:'🍽️',t:'warning',title:t('ins2t_high'),text:getLang()==='hu'?`Az étteremre fordított kiadás ${restPct.toFixed(0)}% a bevételedből. Egy-két főzős hét sokat segíthet!`:`Dining out is ${restPct.toFixed(0)}% of your income. A couple of home-cooking weeks can make a big difference!`});
  else if(restPct>10)insights.push({e:'🍜',t:'info',title:t('ins2t_mid'),text:getLang()==='hu'?`${restPct.toFixed(0)}% megy étteremre – normális egy aktív fiatalnak. Tartsd szemmel.`:`${restPct.toFixed(0)}% goes to dining out – normal for an active person. Just keep an eye on it.`});
  else if(avgRest>0)insights.push({e:'✅',t:'success',title:t('ins2t_low'),text:getLang()==='hu'?`Az étterem-kiadásaid ${restPct.toFixed(0)}% – egészséges egyensúly.`:`Your dining spend is ${restPct.toFixed(0)}% – a healthy balance between enjoyment and discipline.`});

  // 3. DCA streak
  if(state.currentYear===_NOW.getFullYear()){
    const mnow=_NOW.getMonth()+1;
    const invSoFar=ms.slice(0,mnow).filter(m=>m.invested>0).length;
    if(invSoFar===mnow&&mnow>=2)insights.push({e:'🔥',t:'success',title:`${invSoFar} ${getLang()==='hu'?'hónapos':'-month'} ${t('ins3t_streak')}`,text:getLang()==='hu'?`Minden hónapban befektettél idén – ez az, amit a legjobb befektetők csinálnak.`:`You've invested every month this year – that's exactly what the best investors do.`});
    else if(mnow>2&&invSoFar<mnow)insights.push({e:'📅',t:'info',title:t('ins3t_cons'),text:getLang()==='hu'?`${invSoFar}/${mnow} hónapban fektettél be idén. Próbálj automatizálni!`:`You've invested in ${invSoFar}/${mnow} months this year. Try automating it so you never miss a month!`});
  }

  // 4. Emergency fund
  const totEmg=ms.reduce((s,m)=>s+m.emergency,0);
  const avgExp=ms.map(m=>mExp(m)).reduce((a,b)=>a+b,0)/12;
  const emgMonths=avgExp>0?totEmg/avgExp:0;
  if(totEmg===0)insights.push({e:'🛡️',t:'warning',title:t('ins4t_miss'),text:getLang()==='hu'?`Érdemes vészalapot felépíteni – 2-3 havi kiadás elegendő (≈${fmt(Math.round(avgExp*3))}).`:`Consider building an emergency fund – 2-3 months of expenses is enough (≈${fmt(Math.round(avgExp*3))}).`});
  else if(emgMonths>=3)insights.push({e:'✅',t:'success',title:t('ins4t_ok'),text:getLang()==='hu'?`${emgMonths.toFixed(1)} havi kiadást fed a vészalapod – kiváló!`:`Your emergency fund covers ${emgMonths.toFixed(1)} months of expenses – excellent!`});
  else insights.push({e:'🛡️',t:'info',title:t('ins4t_build'),text:getLang()==='hu'?`Jó kezdet! Jelenleg ≈${emgMonths.toFixed(1)} havi kiadást fed. Cél: 3 hónap (≈${fmt(Math.round(avgExp*3))}).`:`Good start! Currently covers ≈${emgMonths.toFixed(1)} months. Goal: 3 months (≈${fmt(Math.round(avgExp*3))}).`});

  // 5. Secondary currency asset
  const sc=state.secondaryCurrency;
  const secVal=curAssets.cashEUR*(sc?sc.rate:0);
  if(sc&&curAssets.cashEUR>0)insights.push({e:'💶',t:'info',title:t('ins5t_sec'),text:getLang()==='hu'?`${curAssets.cashEUR} ${sc.symbol} (≈${fmt(Math.round(secVal))}) stabil értéktároló infláció ellen.`:`${curAssets.cashEUR} ${sc.symbol} (≈${fmt(Math.round(secVal))}) is a solid inflation hedge. Keep it.`});

  // 6. Cash preference
  insights.push({e:'💵',t:'info',title:t('ins6t_cash'),text:getLang()==='hu'?`A fizikai pénzzel való gazdálkodás természetesen visszafog a felesleges kiadásoktól.`:`Managing physical cash naturally limits impulse spending. Combine it with bank savings and ETF investing for the best result.`});

  return insights;
}

function genForecast(){
  const yd=getYD(),ms=yd.months;
  const wi=ms.filter(m=>m.invested>0);
  const avgInv=wi.length>0?wi.reduce((s,m)=>s+m.invested,0)/wi.length:0;
  const mwi=ms.filter(m=>mInc(m)>0);
  const avgInc=mwi.length>0?mwi.reduce((s,m)=>s+mInc(m),0)/mwi.length:68000;
  const ytd=ms.slice(0,_NOW.getMonth()+1).reduce((s,m)=>s+m.invested,0);
  const planned=ms.reduce((s,m)=>s+m.invested,0);
  const remM=12-(_NOW.getMonth()+1);
  const projected=Math.max(ytd+(avgInv||0)*remM,planned);
  const monthly=planned>0?planned/12:avgInv;
  const expRet=state.investmentConfig.expectedReturn;
  return{
    ytd,planned,projected,
    avgComp:avgInc>0?avgInv/avgInc*100:0,
    avgInv,avgInc,expRet,
    fiveY:fv(monthly,expRet,5),tenY:fv(monthly,expRet,10),
    active:wi.length
  };
}

  const btn=document.getElementById('chat-btn');if(btn)btn.disabled=true;
  inp.disabled=true;

  try{
    const yd=getYD(),m=getMD(),ma=m.assets;

      ?`| ${state.secondaryCurrency.code} ${ma.cashEUR}\u00a0${state.secondaryCurrency.symbol} (≈${fmt(Math.round(ma.cashEUR*state.secondaryCurrency.rate))})`
      :'';
    const sysPrompt=`You are a supportive personal finance assistant.

CURRENT FINANCIAL DATA:
- Monthly income: ${fmt(mInc(m))}
- Monthly expenses: Core ${fmt(mCore(m))} | Choice ${fmt(mChoice(m))} | Total ${fmt(mExp(m))}
- Monthly investment: ${fmt(m.invested)} (${cfg.name}${cfg.ticker?' ['+cfg.ticker+']':''}, DCA strategy, expected annual return ${cfg.expectedReturn}%${cfg.note?', '+cfg.note:''})
- Tax account: ${getAcctName()} · ${state.investmentAccount.taxFree?'Tax-free':'Tax-deferred'}${state.investmentAccount.annualLimit?' · Annual limit: '+fmt(state.investmentAccount.annualLimit):''}${state.investmentAccount.lockupYears?' · Lock-up: '+state.investmentAccount.lockupYears+'y':''}${state.investmentAccount.note?' · '+state.investmentAccount.note:''}
- Year ${state.currentYear} total invested so far: ${fmt(yearInv())}
- Assets: Bank ${fmt(ma.bank)} | Local Cash ${fmt(ma.cashHUF)} ${scInfo}| Portfolio ${fmt(ma.portfolio)}
${state.secondaryCurrency?`- ${state.secondaryCurrency.code}/${getCurrSym()} rate: ${state.secondaryCurrency.rate}`:''}
${(state.goals||[]).length>0?`
FINANCIAL GOALS:
${(state.goals||[]).map(g=>{const pct=g.targetAmount>0?Math.min(100,g.currentAmount/g.targetAmount*100):0;const mo=g.monthlyContribution>0?Math.ceil(Math.max(0,g.targetAmount-g.currentAmount)/g.monthlyContribution):null;return`- ${g.emoji||'🎯'} ${g.name} [${g.type||'savings'}]: ${fmt(g.currentAmount)}/${fmt(g.targetAmount)} (${pct.toFixed(0)}%)${g.monthlyContribution>0?`, ${fmt(g.monthlyContribution)}/mo`:''}${mo!==null?`, ~${mo} months left`:''}${g.targetDate?`, target ${g.targetDate}`:''}`}).join('\n')}`:''
}

PHILOSOPHY: Long-term DCA investing only. ${cfg.name}${cfg.ticker?' ('+cfg.ticker+')':''}. No day trading. No gambling. No crypto speculation. Small consistent steps while enjoying youth.
PERSONALITY: Supportive, realistic, non-judgmental. Never shame spending on food, travel, or experiences.
LANGUAGE: Respond in the same language as the user (Hungarian or English). Be concise (2-4 sentences unless the question requires more).`;

    // Build history: exclude the current (last) user message — it goes as the final content item
    const prevMsgs=chatMessages.slice(0,-1).slice(-8);
    const contents=[
      ...prevMsgs.map(x=>({role:x.role==='user'?'user':'model',parts:[{text:x.content}]})),
      {role:'user',parts:[{text:msg}]}
    ];

    // Try gemini-1.5-flash (widest free-tier availability), fallback to 2.0-flash-lite
    const MODELS=['gemini-1.5-flash','gemini-2.0-flash-lite','gemini-2.0-flash'];
    let resp=null,lastErr=null;
    for(const model of MODELS){
      try{
        resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${state.geminiKey}`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({system_instruction:{parts:[{text:sysPrompt}]},contents})
        });
        if(resp.status===404){resp=null;continue;} // try next model
        break;
      }catch(e){lastErr=e;}
    }
    if(!resp)throw lastErr||new Error('HTTP_404:No model available');

    if(resp.status===429){
      // Auto-retry once after 8 seconds
      const retryMsg=document.getElementById('typing');
      if(retryMsg){retryMsg.querySelector('.chat-bubble').textContent='⏳ Rate limit – újrapróbálás 8 másodperc múlva...';}
      await new Promise(r=>setTimeout(r,8000));
      resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.geminiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({system_instruction:{parts:[{text:sysPrompt}]},contents})
      });
    }

    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(`HTTP_${resp.status}:${errData?.error?.message||''}`);
    }

    const data=await resp.json();
    const aiMsg=data.candidates?.[0]?.content?.parts?.[0]?.text||'Nem kaptam választ. Próbáld újra!';
    chatMessages.push({role:'ai',content:aiMsg});

  }catch(err){
    const msg2=err.message||'';
    let e='';
    if(msg2.includes('HTTP_429')||msg2.includes('RESOURCE_EXHAUSTED')||msg2.includes('quota')){
      e=getLang()==='hu'?'⏳ **Rate limit elérve.** Az ingyenes Gemini tier percenként korlátozott. Várj 1-2 percet!':'⏳ **Rate limit reached.** The free Gemini tier is limited per minute. Wait 1-2 minutes and try again.';
    }else if(msg2.includes('HTTP_400')||msg2.includes('INVALID_ARGUMENT')){
      e=getLang()==='hu'?'❌ **Formátum hiba (400).** Töröld a chat előzményeket és próbáld újra.':'❌ **Format error (400).** Clear the chat history and try again.';
    }else if(msg2.includes('HTTP_403')||msg2.includes('API_KEY')||msg2.includes('key not valid')){
      e=getLang()==='hu'?'🔑 **Érvénytelen API kulcs.** Ellenőrizd az aistudio.google.com oldalon.':'🔑 **Invalid API key.** Please check it at aistudio.google.com.';
    }else if(msg2.includes('HTTP_401')){
      e=getLang()==='hu'?'🔑 **Hitelesítési hiba.** Az API kulcs lejárt vagy érvénytelen.':'🔑 **Auth error.** The API key is expired or invalid.';
    }else{
      e='❌ '+(msg2||getLang()==='hu'?'Ismeretlen hiba. Próbáld újra!':'Unknown error. Please try again.');
    }
    chatMessages.push({role:'ai',content:e});
  }

  const t=document.getElementById('typing');if(t)t.remove();
  const btn2=document.getElementById('chat-btn'),inp2=document.getElementById('chat-in');
  if(btn2)btn2.disabled=false;if(inp2){inp2.disabled=false;inp2.focus();}
  const msgs2=document.getElementById('chat-msgs');
  if(msgs2){
    msgs2.innerHTML=chatMessages.map(m=>`<div class="chat-msg ${m.role}"><div class="chat-bubble">${m.content.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')}</div></div>`).join('');
    msgs2.scrollTop=msgs2.scrollHeight;
  }
}

// Visual viewport handler: keeps sheet above keyboard on mobile
let _vpListener = null;
function _attachVP(){
  if(!window.visualViewport)return;
  _vpListener=()=>{
    const ov=document.getElementById('sheet-overlay');
    if(!ov||!ov.classList.contains('open'))return;
    const vv=window.visualViewport;
    ov.style.height=vv.height+'px';
    ov.style.top=vv.offsetTop+'px';
  };
  window.visualViewport.addEventListener('resize',_vpListener);
  window.visualViewport.addEventListener('scroll',_vpListener);
}
function _detachVP(){
  if(!window.visualViewport||!_vpListener)return;
  window.visualViewport.removeEventListener('resize',_vpListener);
  window.visualViewport.removeEventListener('scroll',_vpListener);
  _vpListener=null;
  const ov=document.getElementById('sheet-overlay');
  if(ov){ov.style.height='';ov.style.top='';}
}

function setCursorToEnd(el){
  if(el.setSelectionRange){const l=el.value.length;el.setSelectionRange(l,l);}
}
function openSheet(title,bodyHTML,onSave){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=bodyHTML;
  sheetCb=onSave;
  const ov=document.getElementById('sheet-overlay');
  ov.style.display='flex';
  requestAnimationFrame(()=>ov.classList.add('open'));
  _attachVP();
  setTimeout(()=>{
    document.querySelectorAll('#sheet-body input[inputmode="numeric"]').forEach(inp=>{
      inp.addEventListener('focus',function(){setCursorToEnd(this);});
    });
    const i=document.querySelector('#sheet-body input:not([type=range])');if(i)i.focus();
  },300);
}
function closeSheet(){
  const ov=document.getElementById('sheet-overlay');
  ov.classList.remove('open');
  _detachVP();
  setTimeout(()=>{ov.style.display='none';sheetCb=null;},300);
}
document.getElementById('sheet-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('sheet-overlay'))closeSheet();});
document.getElementById('sheet-cancel').addEventListener('click',closeSheet);
document.getElementById('sheet-save').addEventListener('click',()=>{if(sheetCb)sheetCb();});

function _incFreqChange(){
  const freq=document.getElementById('inp-freq')?.value;
  const isVar=freq==='variable';
  const box=document.getElementById('inc-var-box');
  if(box){
    if(isVar){
      const curOvRaw=getVarOverride(window._editIncId||0,state.currentYear,state.currentMonth);
      const curOv=curOvRaw!==null&&curOvRaw!==undefined?curOvRaw:'';
      box.innerHTML=`<div class="var-override-box">
        <div class="var-override-label">📅 ${t('thisMonthOverride')} — ${t('months')[state.currentMonth-1]}</div>
        <input class="sheet-input" id="inp-ov" type="text" inputmode="numeric" value="${curOv}" placeholder="${t('thisMonthHint')}">
        <div style="font-size:11px;color:var(--muted2);margin-top:-6px;margin-bottom:8px">${t('thisMonthHint')}</div>
      </div>`;
    } else { box.innerHTML=''; }
  }
  _incEquivUpdate();
}
function _incEquivUpdate(){
  const note=document.getElementById('inc-equiv-note');if(!note)return;
  const freq=document.getElementById('inp-freq')?.value||'monthly';
  const amt=parseFloat(document.getElementById('inp-am')?.value)||0;
  if(freq!=='monthly'&&freq!=='variable'&&amt>0){
    note.innerHTML=`<div style="font-size:11px;color:var(--accent4);font-family:var(--font-mono);margin-top:-8px;margin-bottom:10px">≈ ${fmt(Math.round(amt*freqMultiplier(freq)))} ${t('monthlyEquiv')}</div>`;
  } else { note.innerHTML=''; }
}
let _gnOpen=false;
function _gnToggle(){
  _gnOpen=!_gnOpen;
  const body=document.getElementById('gn-body');
  const btn=document.getElementById('gn-toggle');
  if(body)body.style.display=_gnOpen?'block':'none';
  if(btn)btn.textContent=_gnOpen?t('grossNetCalcOpen'):t('grossNetCalc');
}
function _gnCalc(){
  const gross=parseFloat(document.getElementById('inp-gross')?.value)||0;
  const tax=parseFloat(document.getElementById('inp-tax')?.value)||0;
  const net=Math.round(gross*(1-tax/100));
  const el=document.getElementById('gn-net');
  if(el)el.textContent=gross>0?fmt(net):'—';
}
function _gnUse(){
  const gross=parseFloat(document.getElementById('inp-gross')?.value)||0;
  const tax=parseFloat(document.getElementById('inp-tax')?.value)||0;
  const net=Math.round(gross*(1-tax/100));
  const amEl=document.getElementById('inp-am');
  if(amEl&&gross>0){amEl.value=String(net);_incEquivUpdate();}
}

function editIncItem(id){

    it.name=n; it.amount=am; it.frequency=freq; it.isVariable=isVar;
    // Save tax rate if set
    const taxEl=document.getElementById('inp-tax');

function acctTypeSelect(key){
  const preset=ACCOUNT_PRESETS[key];
  if(!preset) return;
  // Update UI selection
  document.querySelectorAll('.acct-type-btn').forEach(b=>b.classList.remove('selected'));
  const btn=document.getElementById('atype-'+key);
  if(btn) btn.classList.add('selected');
  // Update state type
  state.investmentAccount.type=key;
  // Pre-fill fields (except for custom)
  if(key!=='custom'){
    const nameEl=document.getElementById('acct-name');
    if(nameEl) nameEl.value=preset.name;
    const tfEl=document.getElementById('acct-taxfree');
    if(tfEl) tfEl.checked=preset.taxFree;
    const limEl=document.getElementById('acct-limit');
    if(limEl) limEl.value=preset.annualLimit||'';
    const lockEl=document.getElementById('acct-lockup');
    if(lockEl) lockEl.value=preset.lockupYears||'';
    const noteEl=document.getElementById('acct-note');
    if(noteEl) noteEl.value=preset.note||'';
  }
}
