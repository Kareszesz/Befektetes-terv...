
<!DOCTYPE html>
<html lang="en">
<head><base href="https://d16ilfvy4mv02r.cloudfront.net/workspaces/VWeyRa1OgFpLyIduIFYHjdM1ukrP1G5L/7214ae41-b748-4ac0-96b9-20e90bbb4c76/files/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Financial Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a26;--card:#16161f;--border:rgba(255,255,255,0.07);
  --accent:#7c6aff;--accent2:#3ecf8e;--accent3:#ff6b6b;--accent4:#ffd166;--accent5:#ff9f43;
  --text:#f0f0f8;--muted:#6b6b80;--muted2:#9494a8;
  --font-head:'Syne',sans-serif;--font-body:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;height:100dvh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 60% at 70% -10%,rgba(124,106,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 10% 80%,rgba(62,207,142,0.07) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* HEADER */
#app-header{position:relative;z-index:10;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;}
.app-title{font-family:var(--font-head);font-size:17px;font-weight:800;letter-spacing:-0.02em;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap;}
.month-nav{display:flex;align-items:center;gap:4px;}
.month-nav-btn{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background 0.15s;}
.month-nav-btn:active{background:rgba(255,255,255,0.14);}
.month-nav-display{font-family:var(--font-mono);font-size:13px;color:var(--accent);min-width:92px;text-align:center;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background 0.15s;}
.month-nav-display:active{background:rgba(124,106,255,0.1);}

/* TAB SYSTEM */
#tab-content{flex:1;overflow:hidden;position:relative;z-index:1;}
.tab-pane{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;display:none;max-width:500px;margin:0 auto;width:100%;}
.tab-pane.active{display:block;}
.tab-pane::-webkit-scrollbar{width:3px;}
.tab-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

/* BOTTOM NAV */
#bottom-nav{position:relative;z-index:10;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;cursor:pointer;min-height:54px;gap:2px;border:none;background:none;color:var(--muted);transition:color 0.2s;}
.nav-item.active{color:var(--accent);}
.nav-item:active{opacity:0.7;}
.nav-icon{font-size:18px;line-height:1;}
.nav-label{font-size:9px;font-family:var(--font-mono);letter-spacing:0.02em;white-space:nowrap;}

/* SECTION LABEL */
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;margin-top:20px;display:flex;align-items:center;gap:12px;}
.section-label:first-child{margin-top:0;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.card.tap{cursor:pointer;transition:border-color 0.2s;}
.card.tap:active{border-color:rgba(255,255,255,0.18);}
.card-label{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px;letter-spacing:0.05em;}
.card-value{font-family:var(--font-head);font-size:22px;font-weight:700;letter-spacing:-0.02em;line-height:1.1;}
.card-sub{font-size:11px;color:var(--muted2);margin-top:5px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.full{grid-column:1/-1;}

/* COLORS */
.green{color:var(--accent2);}.purple{color:var(--accent);}.red{color:var(--accent3);}.yellow{color:var(--accent4);}.orange{color:var(--accent5);}

/* RESULT BOX */
.result-box{border-radius:14px;padding:16px 18px;border:1px solid;}
.result-box.green{background:rgba(62,207,142,0.08);border-color:rgba(62,207,142,0.2);}
.result-box.red{background:rgba(255,107,107,0.08);border-color:rgba(255,107,107,0.2);}
.result-box .rb-label{font-size:11px;font-family:var(--font-mono);color:var(--muted2);margin-bottom:4px;}
.result-box .rb-value{font-family:var(--font-head);font-size:26px;font-weight:800;letter-spacing:-0.02em;}
.result-box.green .rb-value{color:var(--accent2);}
.result-box.red .rb-value{color:var(--accent3);}
.result-box .rb-sub{font-size:12px;color:var(--muted2);margin-top:4px;}

/* CAT BADGES */
.cat-badge{display:inline-block;font-size:9px;font-family:var(--font-mono);padding:2px 7px;border-radius:6px;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;flex-shrink:0;}
.cat-badge.core{background:rgba(62,207,142,0.12);color:var(--accent2);border:1px solid rgba(62,207,142,0.2);}
.cat-badge.choice{background:rgba(124,106,255,0.12);color:var(--accent);border:1px solid rgba(124,106,255,0.2);}
.cat-badge.compound{background:rgba(255,209,102,0.12);color:var(--accent4);border:1px solid rgba(255,209,102,0.2);}

/* MONEY MAP BARS */
.mm-bar-row{margin-bottom:12px;}
.mm-bar-row:last-child{margin-bottom:0;}
.mm-bar-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.mm-bar-name{font-size:12px;color:var(--muted2);font-family:var(--font-mono);display:flex;align-items:center;gap:6px;}
.mm-bar-nums{display:flex;align-items:center;gap:8px;}
.mm-bar-amount{font-size:12px;color:var(--text);font-family:var(--font-mono);}
.mm-bar-pct{font-size:11px;color:var(--muted);font-family:var(--font-mono);min-width:38px;text-align:right;}
.mm-bar-track{height:8px;border-radius:4px;background:rgba(255,255,255,0.07);overflow:hidden;}
.mm-bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.mm-bar-fill.core-fill{background:var(--accent2);}
.mm-bar-fill.choice-fill{background:var(--accent);}
.mm-bar-fill.compound-fill{background:var(--accent4);}
.mm-bar-fill.remain-fill{background:rgba(255,255,255,0.18);}

/* SCORE */
.score-big-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:10px;}
.score-big-num{font-family:var(--font-head);font-size:58px;font-weight:800;line-height:1;letter-spacing:-0.03em;flex-shrink:0;}
.score-big-info{flex:1;min-width:0;}
.score-big-label{font-family:var(--font-head);font-size:17px;font-weight:700;margin-bottom:2px;}
.score-big-sub{font-size:11px;color:var(--muted2);line-height:1.5;}
.score-big-pct{font-family:var(--font-mono);font-size:20px;font-weight:600;margin-top:6px;}
.score-compare{display:flex;gap:8px;margin-top:10px;}
.score-mini-card{flex:1;background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 8px;text-align:center;}
.score-mini-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:5px;letter-spacing:0.05em;}
.score-mini-num{font-family:var(--font-head);font-size:28px;font-weight:800;line-height:1;letter-spacing:-0.02em;}
.score-mini-sub{font-size:10px;color:var(--muted2);margin-top:3px;font-family:var(--font-mono);}
.score-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-family:var(--font-mono);}
.score-badge.green{background:rgba(62,207,142,0.15);color:var(--accent2);}
.score-badge.yellow{background:rgba(255,209,102,0.15);color:var(--accent4);}
.score-badge.orange{background:rgba(255,159,67,0.15);color:var(--accent5);}
.score-badge.red{background:rgba(255,107,107,0.15);color:var(--accent3);}

/* MONTH PILLS */
.month-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px;}
.month-pills::-webkit-scrollbar{display:none;}
.month-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;font-family:var(--font-mono);cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted2);transition:all 0.15s;white-space:nowrap;}
.month-pill.active{background:rgba(124,106,255,0.15);border-color:rgba(124,106,255,0.4);color:var(--accent);}
.month-pill.has-inv{border-color:rgba(62,207,142,0.3);color:var(--accent2);}
.month-pill.active.has-inv{background:rgba(62,207,142,0.1);border-color:rgba(62,207,142,0.5);}

/* BUDGET SECTIONS */
.budget-sec{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.budget-item-v2{padding:11px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s;}
.budget-item-v2:last-child{border-bottom:none;}
.budget-item-v2:active{background:rgba(255,255,255,0.04);}
.budget-item-v2 .item-name{flex:1;font-size:14px;min-width:0;}
.budget-item-v2 .item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.budget-item-v2 .item-amount{font-family:var(--font-mono);font-size:13px;font-weight:500;white-space:nowrap;}
.item-amount.income{color:var(--accent2);}.item-amount.expense{color:var(--accent3);}
.budget-sec-footer{padding:11px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);background:rgba(0,0,0,0.15);}
.footer-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:0.05em;}
.footer-pct{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.footer-total{font-family:var(--font-mono);font-size:14px;font-weight:500;}

/* INVESTMENT LIST */
.month-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:3px solid transparent;transition:border-color 0.15s;margin-bottom:8px;}
.month-item:active{border-color:rgba(255,255,255,0.18);}
.month-item.has-inv{border-left-color:rgba(62,207,142,0.5);}
.month-item.is-current{border-left-color:rgba(124,106,255,0.6);}
.month-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;}
.month-dot.filled{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 8px rgba(62,207,142,0.4);}
.month-dot.current{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(124,106,255,0.6);}
.month-info{flex:1;min-width:0;}
.month-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;}
.month-note{font-size:11px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.month-alloc{font-size:10px;color:var(--muted);font-family:var(--font-mono);margin-top:2px;}
.current-badge{background:rgba(124,106,255,0.2);color:var(--accent);font-size:10px;font-family:var(--font-mono);padding:2px 7px;border-radius:10px;}
.month-amount{font-family:var(--font-mono);font-size:13px;white-space:nowrap;color:var(--muted);}
.month-amount.active{color:var(--accent2);}

/* CALCULATOR */
.calc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;}
.slider-group{margin-bottom:18px;}
.slider-group:last-child{margin-bottom:0;}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.slider-label{font-size:13px;color:var(--muted2);}
.slider-val{font-family:var(--font-mono);font-size:15px;font-weight:500;}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:rgba(255,255,255,0.1);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(124,106,255,0.25),0 2px 8px rgba(0,0,0,0.4);cursor:pointer;}
input[type=range]:active::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(124,106,255,0.3),0 2px 8px rgba(0,0,0,0.4);}
.stat-card{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px 8px;text-align:center;}
.stat-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:6px;letter-spacing:0.05em;}
.stat-value{font-family:var(--font-head);font-size:18px;font-weight:700;letter-spacing:-0.02em;}
.milestone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.milestone-card{background:rgba(255,255,255,0.04);border-radius:10px;padding:12px;}
.milestone-label{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:4px;}
.milestone-value{font-family:var(--font-head);font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-0.02em;}
.milestone-sub{font-size:11px;color:var(--muted2);}
.chart-wrap{position:relative;width:100%;height:220px;margin-top:16px;}
.sync-btn{width:100%;background:rgba(124,106,255,0.1);border:1px solid rgba(124,106,255,0.25);color:var(--accent);border-radius:12px;padding:12px;font-size:13px;font-family:var(--font-body);cursor:pointer;transition:background 0.15s;margin-top:12px;}
.sync-btn:active{background:rgba(124,106,255,0.22);}

/* INVEST CONFIG CARD */
.invest-cfg-card{background:var(--card);border:1px solid rgba(124,106,255,0.3);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:14px;gap:12px;transition:border-color 0.2s;}
.invest-cfg-card:active{border-color:rgba(124,106,255,0.6);}
.invest-cfg-left{flex:1;min-width:0;}
.invest-cfg-name{font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.invest-cfg-ticker{font-family:var(--font-mono);font-size:11px;background:rgba(124,106,255,0.15);color:var(--accent);padding:2px 7px;border-radius:8px;}
.invest-cfg-detail{font-size:11px;color:var(--muted2);margin-top:3px;font-family:var(--font-mono);}
.invest-cfg-icon{font-size:18px;color:var(--muted);flex-shrink:0;}

/* ANALYTICS */
.an-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.an-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.an-sub{font-size:11px;color:var(--muted2);margin-bottom:14px;}
.chart-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);}
.legend-dot{width:10px;height:10px;border-radius:2px;display:inline-block;}

/* AI TAB */
.insight-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:14px;align-items:flex-start;}
.insight-emoji{font-size:24px;line-height:1;flex-shrink:0;margin-top:2px;}
.insight-body{flex:1;min-width:0;}
.insight-title{font-size:14px;font-weight:600;margin-bottom:4px;}
.insight-text{font-size:13px;color:var(--muted2);line-height:1.5;}
.insight-card.success{border-color:rgba(62,207,142,0.25);background:rgba(62,207,142,0.04);}
.insight-card.warning{border-color:rgba(255,209,102,0.25);background:rgba(255,209,102,0.04);}
.insight-card.danger{border-color:rgba(255,107,107,0.25);background:rgba(255,107,107,0.04);}
.insight-card.info{border-color:rgba(124,106,255,0.25);background:rgba(124,106,255,0.04);}

/* FORECAST */
.forecast-card{background:linear-gradient(135deg,rgba(124,106,255,0.1) 0%,rgba(62,207,142,0.06) 100%);border:1px solid rgba(124,106,255,0.3);border-radius:14px;padding:20px;margin-bottom:10px;}
.forecast-title{font-size:11px;font-family:var(--font-mono);color:var(--muted2);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:10px;}
.forecast-amount{font-family:var(--font-head);font-size:36px;font-weight:800;letter-spacing:-0.03em;color:var(--accent);margin-bottom:6px;}
.forecast-detail{font-size:12px;color:var(--muted2);line-height:1.6;}
.forecast-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.forecast-bar-item{background:rgba(255,255,255,0.04);border-radius:10px;padding:10px 8px;text-align:center;}
.forecast-bar-label{font-size:9px;font-family:var(--font-mono);color:var(--muted);margin-bottom:4px;letter-spacing:0.05em;text-transform:uppercase;}
.forecast-bar-value{font-family:var(--font-head);font-size:16px;font-weight:700;}

/* CHAT */
.chat-container{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.chat-header-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.chat-header-name{font-size:14px;font-weight:600;}
.chat-header-sub{font-size:11px;color:var(--muted2);}
.chat-messages{padding:16px;min-height:80px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;}
.chat-messages::-webkit-scrollbar{width:3px;}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
.chat-msg{display:flex;gap:8px;}
.chat-msg.user{flex-direction:row-reverse;}
.chat-bubble{padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;max-width:88%;}
.chat-msg.ai .chat-bubble{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px 16px 16px 16px;}
.chat-msg.user .chat-bubble{background:rgba(124,106,255,0.2);border:1px solid rgba(124,106,255,0.3);border-radius:16px 4px 16px 16px;}
.chat-typing{display:flex;gap:4px;align-items:center;padding:10px 14px;}
.chat-typing span{width:7px;height:7px;border-radius:50%;background:var(--muted2);animation:typing 1.4s infinite;}
.chat-typing span:nth-child(2){animation-delay:0.2s;}
.chat-typing span:nth-child(3){animation-delay:0.4s;}
@keyframes typing{0%,60%,100%{opacity:0.3;transform:scale(0.85);}30%{opacity:1;transform:scale(1);}}
.chat-input-area{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;}
.chat-input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:var(--text);font-size:14px;font-family:var(--font-body);padding:10px 14px;outline:none;transition:border-color 0.2s;}
.chat-input:focus{border-color:var(--accent);}
.chat-input::placeholder{color:var(--muted);}
.chat-input:disabled{opacity:0.4;cursor:not-allowed;}
.chat-send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:opacity 0.15s;}

function t(key){ return (LOCALES[state.settings?.language||'hu']||LOCALES.hu)[key]||key; }
function getLang(){ return state.settings?.language||'hu'; }
function getCurrSym(){ return state.settings?.currencySymbol||'Ft'; }
function getLocale(){ return getLang()==='hu'?'hu-HU':'en-US'; }

const BASE_INCOME = [];
const BASE_EXPENSES = [];

/* ============================================================
   STATE
============================================================ */
const _NOW = new Date();
let state = {}, activeTab = 'summary', sheetCb = null;
const charts = {};
let chatMessages = [];

function createMonth(n) {
  return {
    month:n,
    income:BASE_INCOME.map(x=>({...x})),
    expenses:BASE_EXPENSES.map(x=>({...x})),
    invested:0,vwce:0,emergency:0,note:'',
    assets:{bank:0,cashHUF:0,cashEUR:0,portfolio:0}
  };
}

function createYear(year) {
  const months = Array.from({length:12},(_,i)=>createMonth(i+1));
  return {months};
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){state=JSON.parse(raw);migrateState();}
    else initDefault();
  } catch(e){initDefault();}
}

function initDefault() {
  state = {
    currentYear:2026,
    currentMonth:_NOW.getMonth()+1,
    eurRate:400,
    geminiKey:'',
    years:{'2026':createYear(2026)},
    calculator:{monthly:16000,rate:7,years:20},
    settings:{language:'hu',currencySymbol:'Ft'},
    investmentConfig:{name:'VWCE ETF',ticker:'VWCE',expectedReturn:7,note:'DCA strategy · TBSZ'},
    onboardingComplete:false
  };
}

function migrateState() {
  if(!state.currentMonth) state.currentMonth = _NOW.getMonth()+1;
  if(!state.geminiKey) state.geminiKey = '';
  if(!state.calculator) state.calculator = {monthly:16000,rate:7,years:20};
  if(state.eurRateLive===undefined) state.eurRateLive=false;
  if(!state.settings) state.settings={language:'hu',currencySymbol:'Ft'};
  if(!state.settings.language) state.settings.language='hu';
  if(!state.settings.currencySymbol) state.settings.currencySymbol='Ft';
  if(!state.investmentConfig) state.investmentConfig={name:'VWCE ETF',ticker:'VWCE',expectedReturn:7,note:'DCA strategy · TBSZ'};
  if(!state.investmentConfig.ticker) state.investmentConfig.ticker='';
  // Existing users: mark onboarding as complete (they already know the app)
  if(state.onboardingComplete===undefined) state.onboardingComplete=true;
  // Sync calculator rate to investmentConfig if calculator was at default
  if(state.calculator.rate===7&&state.investmentConfig.expectedReturn!==7) state.calculator.rate=state.investmentConfig.expectedReturn;
  for(const y of Object.keys(state.years)){
    const yd = state.years[y];
    // Migrate year-level assets → per-month assets
    if(yd.assets && yd.months && yd.months[0] && !yd.months[0].assets){
      yd.months.forEach(m=>{ m.assets={...yd.assets}; });
      delete yd.assets;
    }
    // Ensure every month has an assets object
    if(yd.months) yd.months.forEach(m=>{ if(!m.assets) m.assets={bank:0,cashHUF:0,cashEUR:0,portfolio:0}; });
    // Migrate old format (year-level income/expenses) to per-month
    if(yd.months && yd.months[0] && !yd.months[0].income){
      const oldInc = yd.income||BASE_INCOME;
      const oldExp = yd.expenses||BASE_EXPENSES;
      yd.months.forEach(m=>{
        m.income = oldInc.map(x=>({...x}));
        m.expenses = oldExp.map(x=>({...x}));
        if(m.vwce===undefined) m.vwce=m.invested;
        if(m.emergency===undefined) m.emergency=0;
      });
      delete yd.income; delete yd.expenses; delete yd.summerIncome;
    }
  }
}

function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

/* ============================================================
   HELPERS
============================================================ */
function getYD(){return state.years[String(state.currentYear)];}
function getMD(){return getYD().months[state.currentMonth-1];}
function getMonth(m){return getYD().months[m-1];}

function mInc(m){return m.income.reduce((s,i)=>s+i.amount,0);}
function mCore(m){return m.expenses.filter(e=>e.category==='Core').reduce((s,e)=>s+e.amount,0);}
function mChoice(m){return m.expenses.filter(e=>e.category==='Choice').reduce((s,e)=>s+e.amount,0);}
function mExp(m){return mCore(m)+mChoice(m);}
function mRemain(m){return mInc(m)-mExp(m)-m.invested;}
function yearInv(){return getYD().months.reduce((s,m)=>s+m.invested,0);}

function fmt(n){const sym=getCurrSym();const loc=getLocale();return Number(n).toLocaleString(loc)+'\u00a0'+sym;}
function fmtS(n){n=Number(n);const sym=getCurrSym();const isHu=getLocale()==='hu-HU';if(n>=1000000)return(n/1000000).toFixed(1).replace(isHu?'.':'-', isHu?',':'.')+'\u00a0M';if(n>=1000)return(n/1000).toFixed(0)+(isHu?'e':'k');return String(Math.round(n));}
function fmtM(n){const isHu=getLocale()==='hu-HU';return(n/1000000).toFixed(1).replace(isHu?'.':'-',isHu?',':'.')+'\u00a0M\u00a0'+getCurrSym();}
function fmtP(n){return n.toFixed(1).replace('.',getLocale()==='hu-HU'?',':'.')+'\u00a0%';}
function fv(monthly,rate,years){const r=rate/100/12,n=years*12;if(r===0)return monthly*n;return monthly*((Math.pow(1+r,n)-1)/r);}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escA(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function mmScore(pct){
  if(pct>=20)return{score:3,label:t('great'),emoji:'🟢',cls:'green'};
  if(pct>=10)return{score:2,label:t('okay'),emoji:'🟡',cls:'yellow'};
  if(pct>=5) return{score:1,label:t('needsWork'),emoji:'🟠',cls:'orange'};
  return{score:0,label:t('weak'),emoji:'🔴',cls:'red'};
}
function scoreColor(cls){
  return cls==='green'?'var(--accent2)':cls==='yellow'?'var(--accent4)':cls==='orange'?'var(--accent5)':'var(--accent3)';
}

/* ============================================================
   NAVIGATION
============================================================ */
document.getElementById('prev-month').addEventListener('click',()=>{
  if(state.currentMonth>1){state.currentMonth--;}
  else {
    const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
    const idx=yrs.indexOf(state.currentYear);
    if(idx>0){state.currentYear=yrs[idx-1];state.currentMonth=12;}else return;
  }
  saveState();updateHeader();renderCurrent();
});
document.getElementById('next-month').addEventListener('click',()=>{
  if(state.currentMonth<12){state.currentMonth++;}
  else {
    const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
    const idx=yrs.indexOf(state.currentYear);
    if(idx<yrs.length-1){state.currentYear=yrs[idx+1];state.currentMonth=1;}
    else{makeNewYear();state.currentMonth=1;}
  }
  saveState();updateHeader();renderCurrent();
});
document.getElementById('month-display').addEventListener('click',()=>{
  state.currentYear=_NOW.getFullYear();
  state.currentMonth=_NOW.getMonth()+1;
  if(!state.years[String(state.currentYear)])state.years[String(state.currentYear)]=createYear(state.currentYear);
  saveState();updateHeader();renderCurrent();
});
function makeNewYear(){
  const yrs=Object.keys(state.years).map(Number).sort((a,b)=>a-b);
  const maxY=Math.max(...yrs);
  const ny=maxY+1;
  const prev=state.years[String(maxY)];
  const lastM=prev.months[11];
  const carry=lastM.assets.portfolio+yearInv();
  state.years[String(ny)]=createYear(ny);
  const nyd=state.years[String(ny)];
  nyd.months.forEach(m=>{
    m.income=lastM.income.map(x=>({...x}));
    m.expenses=lastM.expenses.map(x=>({...x}));
    m.assets={...lastM.assets,portfolio:carry};
  });
  state.currentYear=ny;
}

const PANE={summary:'pane-summary',budget:'pane-budget',invest:'pane-invest',analytics:'pane-analytics',ai:'pane-ai'};
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const tab=btn.dataset.tab;
    if(tab===activeTab)return;
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.getElementById(PANE[tab]).classList.add('active');
    activeTab=tab;renderTab(tab);
  });
});
function renderTab(t){
  if(t==='summary')renderDashboard();
  else if(t==='budget')renderBudget();
  else if(t==='invest')renderInvest();
  else if(t==='analytics')renderAnalytics();
  else if(t==='ai')renderAI();
}
function renderCurrent(){renderTab(activeTab);}

   RENDER: DASHBOARD
============================================================ */
function renderDashboard(){
  const m=getMD(),eur=state.eurRate;
  const a=m.assets;
  const totalAssets=a.bank+a.cashHUF+a.cashEUR*eur+a.portfolio;
  const inc=mInc(m),core=mCore(m),choice=mChoice(m),inv=m.invested,remain=mRemain(m);
  const corePct=inc>0?core/inc*100:0,choicePct=inc>0?choice/inc*100:0;
  const compPct=inc>0?inv/inc*100:0,remPct=inc>0?Math.max(0,remain/inc*100):0;
  const score=mmScore(compPct);
  const yd=getYD();
  const yInv=yearInv(),actM=yd.months.filter(mm=>mm.invested>0).length;
  const mwi=yd.months.filter(mm=>mInc(mm)>0);
  const avgComp=mwi.length>0?mwi.map(mm=>mInc(mm)>0?mm.invested/mInc(mm)*100:0).reduce((a,b)=>a+b,0)/mwi.length:0;

function renderBudget(){
  const m=getMD();

  const core=mCore(m),choice=mChoice(m),inv=m.invested,remain=mRemain(m);
  const corePct=inc>0?core/inc*100:0,choicePct=inc>0?choice/inc*100:0,compPct=inc>0?inv/inc*100:0;
  const score=mmScore(compPct);

  const pills=t('monthsShort').map((n,i)=>{
    const mn=i+1,mm=getMonth(mn);

    <div class="budget-item-v2" onclick="editIncItem(${it.id})">

    </div>`).join('');

    <div style="font-family:var(--font-head);font-size:20px;font-weight:700">${t('months')[state.currentMonth-1]}</div>
    <div class="score-badge ${score.cls}">${score.emoji} ${t('score')}: ${score.score}/3</div>
  </div>

  <div class="section-label">${t('capital')}</div>
  <div class="budget-sec">

    <div class="budget-sec-footer"><span class="footer-label">${t('total')}</span><span class="footer-pct">${fmtP(corePct)}</span><span class="footer-total red">−${fmt(core)}</span></div>
  </div>

  <div class="section-label">${t('choiceExpenses')}</div>

    <div>${choiceHtml||`<div class="empty-row">${t('noChoiceExp')}</div>`}</div>

function setMonth(n){state.currentMonth=n;saveState();updateHeader();renderCurrent();}

function applyIncomeToAll(){
  const src=getMD();
  if(!confirm(t('confirmIncomeAll')))return;
  getYD().months.forEach(m=>{ if(m.month!==state.currentMonth) m.income=src.income.map(x=>({...x})); });
  saveState();renderBudget();
}
function applyExpensesToAll(){
  const src=getMD();
  if(!confirm(t('confirmExpAll')))return;
  getYD().months.forEach(m=>{ if(m.month!==state.currentMonth) m.expenses=src.expenses.map(x=>({...x})); });
  saveState();renderBudget();
}

    :`⚠️ Note: The ${cfg.expectedReturn}% return is the historical average for ${escH(cfg.name)} – actual returns may vary. Not financial advice.`;
  document.getElementById('pane-invest').innerHTML=`<div class="fade-in">
  <div class="section-label">${t('yearSummary')}</div>
  <div class="invest-cfg-card" onclick="editInvestmentConfig()">
    <div class="invest-cfg-left">
      <div class="invest-cfg-name">${escH(cfg.name)}${cfg.ticker?`<span class="invest-cfg-ticker">${escH(cfg.ticker)}</span>`:''}</div>
      <div class="invest-cfg-detail">${cfg.expectedReturn}% ${getLang()==='hu'?'várható éves hozam':'expected annual return'}${cfg.note?' · '+escH(cfg.note):''}</div>
    </div>
    <span class="invest-cfg-icon">⚙</span>
  </div>
  <div class="grid-2">
    <div class="card"><div class="card-label">${t('investedYear')} ${state.currentYear}</div><div class="card-value purple">${fmtS(yInv)}</div><div class="card-sub">${fmt(yInv)}</div></div>
    <div class="card"><div class="card-label">${t('activeMonthsFull')}</div><div class="card-value purple">${actM}</div><div class="card-sub">${t('months12')}</div></div>
  </div>

  <div class="section-label">${t('compoundCalc')}</div>

    <div class="slider-group"><div class="slider-top"><span class="slider-label">${t('monthlyInv')}</span><span class="slider-val" id="sv-monthly">${fmt(c.monthly)}</span></div><input type="range" id="sl-monthly" min="5000" max="100000" step="1000" value="${c.monthly}" oninput="updateCalc()"></div>
    <div class="slider-group"><div class="slider-top"><span class="slider-label">${t('annualReturn')}</span><span class="slider-val" id="sv-rate">${c.rate}%</span></div><input type="range" id="sl-rate" min="1" max="20" step="0.5" value="${c.rate}" oninput="updateCalc()"></div>
    <div class="slider-group"><div class="slider-top"><span class="slider-label">${t('timespan')}</span><span class="slider-val" id="sv-years">${c.years} ${t('years')}</span></div><input type="range" id="sl-years" min="1" max="40" step="1" value="${c.years}" oninput="updateCalc()"></div>
    <button class="sync-btn" onclick="syncCalc()">${t('syncFromPlan')}</button>
  </div>
  <div class="grid-3" id="calc-stats"></div>
  <div class="section-label" style="margin-top:16px">${t('growthChart')} · ${c.years} ${t('years')}</div>

    <div class="chart-wrap"><canvas id="growthChart"></canvas></div>

      <span class="legend-item"><span class="legend-dot" style="background:rgba(124,106,255,0.7)"></span>${t('paid')}</span>

function updateCalc(){
  const m=parseInt(document.getElementById('sl-monthly')?.value)||state.calculator.monthly;
  const r=parseFloat(document.getElementById('sl-rate')?.value)||state.calculator.rate;
  const y=parseInt(document.getElementById('sl-years')?.value)||state.calculator.years;
  state.calculator={monthly:m,rate:r,years:y};saveState();updateCalcUI();buildCalcChart();
}
function updateCalcUI(){
  const{monthly,rate,years}=state.calculator;
  const g=id=>document.getElementById(id);
  if(!g('sv-monthly'))return;
  g('sv-monthly').textContent=fmt(monthly);
  g('sv-rate').textContent=rate+'%';
  g('sv-years').textContent=years+' '+t('years');
  const total=fv(monthly,rate,years),invested=monthly*years*12,gain=total-invested;
  const s=g('calc-stats');
  if(s)s.innerHTML=`<div class="stat-card"><div class="stat-label">${t('paid')}</div><div class="stat-value purple">${fmtS(invested)}</div></div><div class="stat-card"><div class="stat-label">${t('gain')}</div><div class="stat-value green">${fmtS(gain)}</div></div><div class="stat-card"><div class="stat-label">${t('total2')}</div><div class="stat-value yellow">${fmtS(total)}</div></div>`;
  const ms=g('calc-milestones');
  if(ms)ms.innerHTML=[5,10,20,30].map(y=>`<div class="milestone-card"><div class="milestone-label">${y} ${t('years')}</div><div class="milestone-value">${fmtM(fv(monthly,rate,y))}</div><div class="milestone-sub">${fmtS(fv(monthly,rate,y))}</div></div>`).join('');
}
function buildCalcChart(){
  const canvas=document.getElementById('growthChart');if(!canvas)return;
  if(charts.growth){charts.growth.destroy();delete charts.growth;}
  const{monthly,rate,years}=state.calculator;
  const labels=[],principal=[],gains=[];
  for(let y=1;y<=years;y++){const t=fv(monthly,rate,y),inv=monthly*y*12;labels.push(y+'');principal.push(Math.round(inv));gains.push(Math.round(t-inv));}
  charts.growth=new Chart(canvas.getContext('2d'),{type:'bar',data:{labels,datasets:[{label:t('paid'),data:principal,backgroundColor:'rgba(124,106,255,0.7)',stack:'a',borderRadius:2},{label:t('gain'),data:gains,backgroundColor:'rgba(62,207,142,0.7)',stack:'a',borderRadius:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+Math.round(ctx.raw).toLocaleString(getLocale())+'\u00a0'+getCurrSym()}}},scales:{x:{stacked:true,ticks:{color:'#6b6b80',autoSkip:true,maxTicksLimit:10},grid:{display:false}},y:{stacked:true,ticks:{color:'#6b6b80',callback:v=>(v/1000000).toFixed(1)+'M'},grid:{color:'rgba(255,255,255,0.05)'}}}}});
}
function syncCalc(){
  const yd=getYD(),wi=yd.months.filter(m=>m.invested>0);
  if(!wi.length)return;
  const avg=Math.round(wi.reduce((s,m)=>s+m.invested,0)/wi.length/1000)*1000;
  const cl=Math.min(100000,Math.max(5000,avg));
  const sl=document.getElementById('sl-monthly');if(sl)sl.value=cl;
  state.calculator.monthly=cl;
  // Also sync rate from investmentConfig
  const configRate=state.investmentConfig.expectedReturn;
  state.calculator.rate=configRate;
  const slr=document.getElementById('sl-rate');if(slr)slr.value=configRate;
  saveState();updateCalcUI();buildCalcChart();
}

function genInsights(){
  const yd=getYD(),ms=yd.months,mwi=ms.filter(m=>mInc(m)>0),mwv=ms.filter(m=>m.invested>0);
  const curAssets=getMD().assets;
  const insights=[];
  const avgComp=mwi.length>0?mwi.map(m=>m.invested/mInc(m)*100).reduce((a,b)=>a+b,0)/mwi.length:0;
  const avgInc=mwi.length>0?mwi.reduce((s,m)=>s+mInc(m),0)/mwi.length:68000;

  // 1. Compound ratio
  if(avgComp>=20)insights.push({e:'🚀',t:'success',title:t('ins1t_great'),text:getLang()==='hu'?`Átlagos ${avgComp.toFixed(1)}%-os Compound arányod van idén – meghaladod a 20%-os Vincent Chan célt. Tartsd meg ezt a tempót!`:`Your average Compound ratio is ${avgComp.toFixed(1)}% this year – you're beating the 20% Vincent Chan target. Keep it up!`});
  else if(avgComp>=10)insights.push({e:'📈',t:'info',title:t('ins1t_good'),text:getLang()==='hu'?`${avgComp.toFixed(1)}% az átlagos befektetési arányod. A 20%-os cél eléréséhez havonta kb. ${fmt(Math.round(avgInc*0.2))} lenne ideális.`:`Your average investment rate is ${avgComp.toFixed(1)}%. To reach the 20% target, aim for around ${fmt(Math.round(avgInc*0.2))}/month.`});
  else if(avgComp>0)insights.push({e:'💡',t:'warning',title:t('ins1t_low'),text:getLang()==='hu'?`Jelenlegi átlag: ${avgComp.toFixed(1)}%. Apró lépésekkel is el lehet jutni a 20%-os célig!`:`Current average: ${avgComp.toFixed(1)}%. Small steps still get you to the 20% goal – consistency beats amount!`});
  else insights.push({e:'🌱',t:'warning',title:t('ins1t_none'),text:getLang()==='hu'?`Még nincs tervezett befektetés. A korai kezdés a legnagyobb előny – akár havi 5-10e Ft is exponenciálisan nő.`:`No investment planned yet. Starting early is the biggest advantage – even a small monthly amount grows exponentially.`});

  // 2. Dining
  const avgRest=ms.map(m=>m.expenses.filter(e=>e.name.toLowerCase().includes('vendég')||e.name.toLowerCase().includes('étterem')||e.name.toLowerCase().includes('resto')||e.name.toLowerCase().includes('dining')||e.name.toLowerCase().includes('restaurant')).reduce((s,e)=>s+e.amount,0)).reduce((a,b)=>a+b,0)/12;
  const restPct=avgInc>0?avgRest/avgInc*100:0;
  if(restPct>25)insights.push({e:'🍽️',t:'warning',title:t('ins2t_high'),text:getLang()==='hu'?`Az étteremre fordított kiadás ${restPct.toFixed(0)}% a bevételedből. Egy-két főzős hét sokat segíthet!`:`Dining out is ${restPct.toFixed(0)}% of your income. A couple of home-cooking weeks can make a big difference!`});
  else if(restPct>10)insights.push({e:'🍜',t:'info',title:t('ins2t_mid'),text:getLang()==='hu'?`${restPct.toFixed(0)}% megy étteremre – normális egy aktív fiatalnak. Tartsd szemmel.`:`${restPct.toFixed(0)}% goes to dining out – normal for an active person. Just keep an eye on it.`});
  else if(avgRest>0)insights.push({e:'✅',t:'success',title:t('ins2t_low'),text:getLang()==='hu'?`Az étterem-kiadásaid ${restPct.toFixed(0)}% – egészséges egyensúly.`:`Your dining spend is ${restPct.toFixed(0)}% – a healthy balance between enjoyment and discipline.`});

  // 3. DCA streak
  if(state.currentYear===_NOW.getFullYear()){
    const mnow=_NOW.getMonth()+1;
    const invSoFar=ms.slice(0,mnow).filter(m=>m.invested>0).length;
    if(invSoFar===mnow&&mnow>=2)insights.push({e:'🔥',t:'success',title:`${invSoFar} ${getLang()==='hu'?'hónapos':'-month'} ${t('ins3t_streak')}`,text:getLang()==='hu'?`Minden hónapban befektettél idén – ez az, amit a legjobb befektetők csinálnak.`:`You've invested every month this year – that's exactly what the best investors do.`});

  }

  // 4. Emergency fund
  const totEmg=ms.reduce((s,m)=>s+m.emergency,0);

  // 6. Cash preference
  insights.push({e:'💵',t:'info',title:t('ins6t_cash'),text:getLang()==='hu'?`A fizikai pénzzel való gazdálkodás természetesen visszafog a felesleges kiadásoktól.`:`Managing physical cash naturally limits impulse spending. Combine it with bank savings and ETF investing for the best result.`});

  return insights;
}

function genForecast(){
  const yd=getYD(),ms=yd.months;
  const wi=ms.filter(m=>m.invested>0);
  const avgInv=wi.length>0?wi.reduce((s,m)=>s+m.invested,0)/wi.length:0;
  const mwi=ms.filter(m=>mInc(m)>0);
  const avgInc=mwi.length>0?mwi.reduce((s,m)=>s+mInc(m),0)/mwi.length:68000;
  const ytd=ms.slice(0,_NOW.getMonth()+1).reduce((s,m)=>s+m.invested,0);
  const planned=ms.reduce((s,m)=>s+m.invested,0);
  const remM=12-(_NOW.getMonth()+1);
  const projected=Math.max(ytd+(avgInv||0)*remM,planned);
  const monthly=planned>0?planned/12:avgInv;
  const expRet=state.investmentConfig.expectedReturn;
  return{
    ytd,planned,projected,
    avgComp:avgInc>0?avgInv/avgInc*100:0,
    avgInv,avgInc,expRet,
    fiveY:fv(monthly,expRet,5),tenY:fv(monthly,expRet,10),
    active:wi.length
  };
}

async function sendChat(){
  if(!state.geminiKey)return;
  const inp=document.getElementById('chat-in');if(!inp)return;
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  chatMessages.push({role:'user',content:msg});

  // Show typing indicator
  const msgs=document.getElementById('chat-msgs');
  if(msgs){const t=document.createElement('div');t.className='chat-msg ai';t.id='typing';t.innerHTML='<div class="chat-bubble chat-typing"><span></span><span></span><span></span></div>';msgs.appendChild(t);msgs.scrollTop=msgs.scrollHeight;}
  const btn=document.getElementById('chat-btn');if(btn)btn.disabled=true;
  inp.disabled=true;

  try{
    const yd=getYD(),m=getMD(),ma=m.assets;
    const cfg=state.investmentConfig;
    const sysPrompt=`You are a supportive personal finance assistant for a Hungarian university student (18 years old).

CURRENT FINANCIAL DATA:
- Monthly income: ${fmt(mInc(m))} (scholarship 58,000 + parent 10,000 HUF)
- Monthly expenses: Core ${fmt(mCore(m))} | Choice ${fmt(mChoice(m))} | Total ${fmt(mExp(m))}
- Monthly investment: ${fmt(m.invested)} (${cfg.name}${cfg.ticker?' ['+cfg.ticker+']':''}, DCA strategy, expected annual return ${cfg.expectedReturn}%${cfg.note?', '+cfg.note:''})
- Year ${state.currentYear} total invested so far: ${fmt(yearInv())}
- Assets: Bank ${fmt(ma.bank)} | Cash HUF ${fmt(ma.cashHUF)} | EUR ${ma.cashEUR}€ (≈${fmt(Math.round(ma.cashEUR*state.eurRate))}) | Portfolio ${fmt(ma.portfolio)}
- EUR/HUF rate: ${state.eurRate} Ft

PHILOSOPHY: Long-term DCA investing only. ${cfg.name}${cfg.ticker?' ('+cfg.ticker+')':''}. TBSZ account. No day trading. No gambling. No crypto speculation. Small consistent steps while enjoying youth.
PERSONALITY: Supportive, realistic, non-judgmental. Student life is valid. Never shame spending on food, travel, or experiences.
LANGUAGE: Respond in the same language as the user (Hungarian or English). Be concise (2-4 sentences unless the question requires more).`;

    // Build history: exclude the current (last) user message — it goes as the final content item
    const prevMsgs=chatMessages.slice(0,-1).slice(-8);
    const contents=[
      ...prevMsgs.map(x=>({role:x.role==='user'?'user':'model',parts:[{text:x.content}]})),
      {role:'user',parts:[{text:msg}]}
    ];

    // Try gemini-1.5-flash (widest free-tier availability), fallback to 2.0-flash-lite
    const MODELS=['gemini-1.5-flash','gemini-2.0-flash-lite','gemini-2.0-flash'];
    let resp=null,lastErr=null;
    for(const model of MODELS){
      try{
        resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${state.geminiKey}`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({system_instruction:{parts:[{text:sysPrompt}]},contents})
        });
        if(resp.status===404){resp=null;continue;} // try next model
        break;
      }catch(e){lastErr=e;}
    }
    if(!resp)throw lastErr||new Error('HTTP_404:No model available');

    if(resp.status===429){
      // Auto-retry once after 8 seconds
      const retryMsg=document.getElementById('typing');
      if(retryMsg){retryMsg.querySelector('.chat-bubble').textContent='⏳ Rate limit – újrapróbálás 8 másodperc múlva...';}
      await new Promise(r=>setTimeout(r,8000));
      resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.geminiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({system_instruction:{parts:[{text:sysPrompt}]},contents})
      });
    }

    if(!resp.ok){
      const errData=await resp.json().catch(()=>({}));
      throw new Error(`HTTP_${resp.status}:${errData?.error?.message||''}`);
    }

    const data=await resp.json();
    const aiMsg=data.candidates?.[0]?.content?.parts?.[0]?.text||'Nem kaptam választ. Próbáld újra!';
    chatMessages.push({role:'ai',content:aiMsg});

  }catch(err){
    const msg2=err.message||'';
    let e='';
    if(msg2.includes('HTTP_429')||msg2.includes('RESOURCE_EXHAUSTED')||msg2.includes('quota')){
      e=getLang()==='hu'?'⏳ **Rate limit elérve.** Az ingyenes Gemini tier percenként korlátozott. Várj 1-2 percet!':'⏳ **Rate limit reached.** The free Gemini tier is limited per minute. Wait 1-2 minutes and try again.';
    }else if(msg2.includes('HTTP_400')||msg2.includes('INVALID_ARGUMENT')){
      e=getLang()==='hu'?'❌ **Formátum hiba (400).** Töröld a chat előzményeket és próbáld újra.':'❌ **Format error (400).** Clear the chat history and try again.';
    }else if(msg2.includes('HTTP_403')||msg2.includes('API_KEY')||msg2.includes('key not valid')){
      e=getLang()==='hu'?'🔑 **Érvénytelen API kulcs.** Ellenőrizd az aistudio.google.com oldalon.':'🔑 **Invalid API key.** Please check it at aistudio.google.com.';
    }else if(msg2.includes('HTTP_401')){
      e=getLang()==='hu'?'🔑 **Hitelesítési hiba.** Az API kulcs lejárt vagy érvénytelen.':'🔑 **Auth error.** The API key is expired or invalid.';
    }else{
      e='❌ '+(msg2||getLang()==='hu'?'Ismeretlen hiba. Próbáld újra!':'Unknown error. Please try again.');
    }
    chatMessages.push({role:'ai',content:e});
  }

  const t=document.getElementById('typing');if(t)t.remove();
  const btn2=document.getElementById('chat-btn'),inp2=document.getElementById('chat-in');
  if(btn2)btn2.disabled=false;if(inp2){inp2.disabled=false;inp2.focus();}
  const msgs2=document.getElementById('chat-msgs');
  if(msgs2){
    msgs2.innerHTML=chatMessages.map(m=>`<div class="chat-msg ${m.role}"><div class="chat-bubble">${m.content.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')}</div></div>`).join('');
    msgs2.scrollTop=msgs2.scrollHeight;
  }
}

// Visual viewport handler: keeps sheet above keyboard on mobile
let _vpListener = null;
function _attachVP(){
  if(!window.visualViewport)return;
  _vpListener=()=>{
    const ov=document.getElementById('sheet-overlay');
    if(!ov||!ov.classList.contains('open'))return;
    const vv=window.visualViewport;
    ov.style.height=vv.height+'px';
    ov.style.top=vv.offsetTop+'px';
  };
  window.visualViewport.addEventListener('resize',_vpListener);
  window.visualViewport.addEventListener('scroll',_vpListener);
}
function _detachVP(){
  if(!window.visualViewport||!_vpListener)return;
  window.visualViewport.removeEventListener('resize',_vpListener);
  window.visualViewport.removeEventListener('scroll',_vpListener);
  _vpListener=null;
  const ov=document.getElementById('sheet-overlay');
  if(ov){ov.style.height='';ov.style.top='';}
}

function setCursorToEnd(el){
  if(el.setSelectionRange){const l=el.value.length;el.setSelectionRange(l,l);}
}
function openSheet(title,bodyHTML,onSave){
  document.getElementById('sheet-title').textContent=title;
  document.getElementById('sheet-body').innerHTML=bodyHTML;
  sheetCb=onSave;
  const ov=document.getElementById('sheet-overlay');
  ov.style.display='flex';
  requestAnimationFrame(()=>ov.classList.add('open'));
  _attachVP();
  setTimeout(()=>{
    document.querySelectorAll('#sheet-body input[inputmode="numeric"]').forEach(inp=>{
      inp.addEventListener('focus',function(){setCursorToEnd(this);});
    });
    const i=document.querySelector('#sheet-body input:not([type=range])');if(i)i.focus();
  },300);
}
function closeSheet(){
  const ov=document.getElementById('sheet-overlay');
  ov.classList.remove('open');
  _detachVP();
  setTimeout(()=>{ov.style.display='none';sheetCb=null;},300);
}
document.getElementById('sheet-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('sheet-overlay'))closeSheet();});

async function fetchLiveEurRate(){
  try{
    const res=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const rate=data.eur&&data.eur.huf;
    if(!rate||isNaN(rate))throw new Error('Bad data');
    return Math.round(rate);
  }catch(err){
    console.warn('Live EUR rate failed:',err);
    return null;
  }
}

async function refreshEurRate(){
  const btn=document.getElementById('eur-refresh-icon');
  if(btn)btn.classList.add('spinning');
  const rate=await fetchLiveEurRate();
  if(btn)btn.classList.remove('spinning');
  if(rate){
    state.eurRate=rate;
    state.eurRateLastFetched=Date.now();
    state.eurRateLive=true;
  } else {
    state.eurRateLive=false;
  }
  saveState();
  renderDashboard();
  if(activeTab==='invest')renderInvest();
}

let wizStep = 1;
let _wizData = null;

function _initWizData() {
  return {
    incomes: [{id:1, name:'', amount:0}],
    expenses: [
      {id:1, name:'Housing', amount:0, category:'Core'},
      {id:2, name:'Food', amount:0, category:'Core'},
      {id:3, name:'Lifestyle', amount:0, category:'Choice'},
    ],

    investName:'VWCE ETF', investTicker:'VWCE', investReturn:7,
    investMonthly:0, investAccount:'TBSZ',
    savingsMonthly:0,
  };
}

function showOnboarding() {
  _wizData = _initWizData();
  wizStep = 1;
  const el = document.createElement('div');
  el.id = 'onboarding-overlay';
  el.innerHTML = `
    <div id="onboarding-card">
      <div id="wizard-progress"></div>
      <div id="wizard-body"></div>
      <div id="wizard-footer">
        <button class="wiz-skip-btn" onclick="skipOnboarding()"></button>
        <div class="wiz-nav-btns">
          <button class="wiz-back-btn" id="wiz-back" onclick="wizBack()"></button>
          <button class="wiz-next-btn" id="wiz-next" onclick="wizNext()"></button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => { el.classList.add('open'); updateWizardStep(); });
}

function closeOnboarding() {
  const el = document.getElementById('onboarding-overlay');
  if (!el) return;
  el.classList.remove('open');
  setTimeout(() => { try{el.remove();}catch(e){} }, 350);
}

function skipOnboarding() {
  state.onboardingComplete = true;
  saveState();
  closeOnboarding();
}

function updateWizardStep() {
  // Update skip/back/next labels (language may have changed on step 1)
  const skipBtn = document.querySelector('.wiz-skip-btn');
  if (skipBtn) skipBtn.textContent = t('wizSkip');
  const backBtn = document.getElementById('wiz-back');
  if (backBtn) { backBtn.textContent = t('wizBack'); backBtn.style.display = wizStep === 1 ? 'none' : ''; }
  const nextBtn = document.getElementById('wiz-next');
  if (nextBtn) { nextBtn.textContent = t('wizNext'); nextBtn.style.display = wizStep === 5 ? 'none' : ''; }

  // Progress dots
  const prog = document.getElementById('wizard-progress');
  if (prog) prog.innerHTML = [1,2,3,4,5].map(i =>
    `<div class="wiz-dot ${i < wizStep ? 'done' : i === wizStep ? 'active' : ''}"></div>`
  ).join('');

  // Render body
  const body = document.getElementById('wizard-body');
  if (!body) return;
  if (wizStep === 1) body.innerHTML = renderWizStep1();
  else if (wizStep === 2) body.innerHTML = renderWizStep2();
  else if (wizStep === 3) body.innerHTML = renderWizStep3();
  else if (wizStep === 4) body.innerHTML = renderWizStep4();
  else if (wizStep === 5) body.innerHTML = renderWizStep5();
  body.scrollTop = 0;

  // Post-render event binding
  if (wizStep === 1) {
    document.querySelectorAll('.lang-opt').forEach(el => {
      el.addEventListener('click', () => {
        state.settings.language = el.dataset.lang;
        saveState(); updateStaticUI(); updateWizardStep();
      });
    });
    document.querySelectorAll('.curr-chip').forEach(el => {
      el.addEventListener('click', () => {
        const val = el.dataset.curr;
        if (val === 'custom') {
          const c = prompt(t('wizCurrLabel') + ':') || state.settings.currencySymbol;
          state.settings.currencySymbol = c.trim() || state.settings.currencySymbol;
        } else {
          state.settings.currencySymbol = val;
        }
        saveState(); updateWizardStep();
      });
    });
  }
  if (wizStep === 4) {
    document.querySelectorAll('.inv-choice-card').forEach(el => {
      el.addEventListener('click', () => {
        wizSaveCurrentStep();
        _wizData.investMode = el.dataset.mode;
        updateWizardStep();
      });
    });
  }
}

function wizSaveCurrentStep() {
  if (wizStep === 2) {
    const rows = document.querySelectorAll('.wiz-inc-row');
    const saved = [];
    rows.forEach((row, i) => {
      const name = row.querySelector('.wiz-inc-name')?.value?.trim() || '';
      const amount = parseFloat(row.querySelector('.wiz-inc-amt')?.value) || 0;
      saved.push({id:i+1, name, amount});
    });
    if (saved.length) _wizData.incomes = saved;
  }
  if (wizStep === 3) {
    const slots = document.querySelectorAll('.wiz-exp-slot');
    const expNames = ['Housing','Food','Lifestyle'];
    const expCats = ['Core','Core','Choice'];
    slots.forEach((slot, i) => {
      const amount = parseFloat(slot.querySelector('.wiz-exp-amt')?.value) || 0;
      _wizData.expenses[i] = {id:i+1, name:expNames[i], amount, category:expCats[i]};
    });
    // Extra expense rows
    const extras = _wizData.expenses.slice(3); // preserve already saved extras
    const newExtras = [];
    document.querySelectorAll('.wiz-extra-exp').forEach((row, i) => {
      const name = row.querySelector('.wiz-extra-name')?.value?.trim() || '';
      const amount = parseFloat(row.querySelector('.wiz-extra-amt')?.value) || 0;
      const cat = row.querySelector('.wiz-extra-cat')?.value || 'Core';
      if (name) newExtras.push({id:10+i, name, amount, category:cat});
    });
    _wizData.expenses = _wizData.expenses.slice(0,3).concat(newExtras);
  }
  if (wizStep === 4) {
    if (_wizData.investMode === 'existing') {
      _wizData.investName  = document.getElementById('wiz-iname')?.value?.trim() || 'VWCE ETF';
      _wizData.investTicker= document.getElementById('wiz-ticker')?.value?.trim() || '';
      _wizData.investReturn= parseFloat(document.getElementById('wiz-ret')?.value) || 7;
      _wizData.investMonthly= parseFloat(document.getElementById('wiz-monthly')?.value) || 0;
      _wizData.investAccount= document.getElementById('wiz-account')?.value?.trim() || '';
    } else if (_wizData.investMode === 'start') {
      _wizData.savingsMonthly = parseFloat(document.getElementById('wiz-savings')?.value) || 0;
    }
  }
}

function wizNext() {
  wizSaveCurrentStep();
  if (wizStep < 5) { wizStep++; updateWizardStep(); }
}

function wizBack() {
  wizSaveCurrentStep();
  if (wizStep > 1) { wizStep--; updateWizardStep(); }
}

function completeOnboarding() {
  wizSaveCurrentStep();
  const lang = getLang();
  const expLabelMap = {
    Housing:  lang==='hu' ? 'Lakhatás / Albérlet' : 'Housing / Rent',
    Food:     lang==='hu' ? 'Élelmiszer / Kaja'     : 'Food',
    Lifestyle:lang==='hu' ? 'Életstílus / Szórakozás':'Lifestyle / Fun',
  };
  const incomes = _wizData.incomes
    .filter(i => i.amount > 0 || i.name)
    .map((i, idx) => ({id:idx+1, name:i.name||(lang==='hu'?'Bevétel':'Income'), amount:i.amount}));
  const expenses = _wizData.expenses
    .filter(e => e.amount > 0 || (e.id >= 10 && e.name))
    .map((e, idx) => ({id:idx+1, name:expLabelMap[e.name]||e.name, amount:e.amount, category:e.category}));
  const invMonthly = _wizData.investMode==='existing' ? (_wizData.investMonthly||0)
                   : _wizData.investMode==='start'    ? (_wizData.savingsMonthly||0) : 0;

  // Apply to all months in current year
  const yd = getYD();
  yd.months.forEach(m => {
    if (incomes.length)  m.income   = incomes.map(x=>({...x}));
    if (expenses.length) m.expenses = expenses.map(x=>({...x}));
    if (invMonthly > 0) { m.invested = invMonthly; m.vwce = invMonthly; }
    if (_wizData.investMode==='start' && invMonthly > 0)
      m.note = lang==='hu' ? 'Tervezett megtakarítás' : 'Planned savings';
  });

  // Investment config
  if (_wizData.investMode === 'existing') {
    state.investmentConfig = {
      name: _wizData.investName || 'VWCE ETF',
      ticker: _wizData.investTicker || '',
      expectedReturn: _wizData.investReturn || 7,
      note: _wizData.investAccount || 'DCA'
    };
    state.calculator.rate = _wizData.investReturn || 7;
  }

  state.onboardingComplete = true;
  saveState();
  closeOnboarding();
  updateStaticUI(); updateHeader();
  renderDashboard(); renderBudget(); renderInvest();
  if (!['summary','budget','invest'].includes(activeTab)) renderTab(activeTab);
}

  const startFields = mode !== 'start' ? '' : `

function renderWizStep5() {
  // Gather wizard data for preview
  const totalInc = _wizData.incomes.reduce((s,i) => s+(parseFloat(i.amount)||0), 0);
  const totalCore = _wizData.expenses.filter(e=>e.category==='Core').reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
  const totalChoice = _wizData.expenses.filter(e=>e.category==='Choice').reduce((s,e) => s+(parseFloat(e.amount)||0), 0);
  const totalInv = _wizData.investMode==='existing' ? (_wizData.investMonthly||0)
                 : _wizData.investMode==='start'    ? (_wizData.savingsMonthly||0) : 0;
  const totalFree = totalInc - totalCore - totalChoice - totalInv;
  const pct = v => totalInc > 0 ? Math.min(100, v/totalInc*100) : 0;
  const corePct=pct(totalCore), choicePct=pct(totalChoice), compPct=pct(totalInv);
  const freePct=Math.max(0, pct(totalFree));
  const score = mmScore(compPct);

  const mmRow = (badgeCls, badge, label, amount, p, fillColor) => `
    <div class="mm-preview-row">
      <div class="mm-preview-label">
        <span style="display:flex;align-items:center;gap:6px"><span class="cat-badge ${badgeCls}" style="font-size:8px;padding:1px 5px">${badge}</span>${label}</span>
        <span>${fmt(amount)} · ${fmtP(p)}</span>
      </div>
      <div class="mm-preview-bar"><div style="width:${p}%;height:100%;border-radius:3px;background:${fillColor}"></div></div>
    </div>`;

  return `
    <div class="wiz-headline">${t('wizStep5Title')}</div>
    <div class="wiz-sub">${t('wizStep5Sub')}</div>
    <div class="mm-preview-card">
      <div style="font-size:12px;color:var(--muted2);margin-bottom:12px">${t('income')}: <span style="color:var(--accent2);font-family:var(--font-mono)">${fmt(totalInc)}</span></div>
      ${mmRow('core','Core',t('necessary'),totalCore,corePct,'var(--accent2)')}
      ${mmRow('choice','Choice',t('discretionary'),totalChoice,choicePct,'var(--accent)')}
      ${mmRow('compound','Compound',t('investment'),totalInv,compPct,'var(--accent4)')}
      <div class="mm-preview-row" style="margin-bottom:0">
        <div class="mm-preview-label">
          <span style="color:var(--muted)">${t('freeRemainder')}</span>
          <span style="color:${totalFree>=0?'var(--text)':'var(--accent3)'}">${totalFree>=0?'+':''}${fmt(totalFree)}</span>
        </div>
        <div class="mm-preview-bar"><div style="width:${freePct}%;height:100%;border-radius:3px;background:rgba(255,255,255,0.18)"></div></div>
      </div>
    </div>
    <div class="score-big-card" style="margin-bottom:4px">
      <div class="score-big-num ${score.cls}">${score.score}</div>
      <div class="score-big-info">
        <div class="score-big-label">${score.emoji} ${score.label}</div>
        <div class="score-big-sub">${t('moneyMapScore')}</div>
        <div class="score-big-pct" style="color:${scoreColor(score.cls)}">${fmtP(compPct)}</div>
      </div>
    </div>
    <button class="wiz-start-btn" onclick="completeOnboarding()">${t('wizStartBtn')}</button>
    <div style="height:32px"></div>`;
}

function showWizTooltip(event, key) {
  event.stopPropagation();
  const text = t(key);
  // Remove any existing tooltip
  document.querySelectorAll('.wiz-tooltip-pop').forEach(el => el.remove());
  const pop = document.createElement('div');
  pop.className = 'wiz-tooltip-pop';
  pop.textContent = text;
  document.body.appendChild(pop);
  const btn = event.currentTarget;
  const rect = btn.getBoundingClientRect();
  const popW = 260;
  let left = rect.left + btn.offsetWidth/2 - popW/2;
  if (left < 8) left = 8;
  if (left + popW > window.innerWidth - 8) left = window.innerWidth - popW - 8;
  pop.style.cssText = `left:${left}px;top:${rect.bottom+8}px;`;
  let timer = setTimeout(() => pop.remove(), 4500);
  document.addEventListener('click', () => { clearTimeout(timer); pop.remove(); }, {once:true, capture:true});
}

renderInvest();

// Fetch live rate on startup (non-blocking)
fetchLiveEurRate().then(rate=>{
  if(rate){
    state.eurRate=rate;
    state.eurRateLastFetched=Date.now();
    state.eurRateLive=true;
    saveState();
    renderDashboard();
    if(activeTab==='invest')renderInvest();
  } else {
    state.eurRateLive=false;
    saveState();
  }
});
